<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<title>記帳</title>
<style>
:root {
  --bg: #f6f6f4;
  --surface: #ffffff;
  --surface-2: #eeeeeb;
  --line: #e1e1dc;
  --text: #1c1c1e;
  --text-2: #5f5f66;
  --text-3: #8a8a91;
  --accent: #0f8a6a;
  --accent-soft: rgba(15, 138, 106, .12);
  --on-accent: #ffffff;
  --warn: #b25e09;
  --warn-soft: rgba(178, 94, 9, .12);
  --danger: #c03a2b;
  --radius: 14px;
  --nav-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141416;
    --surface: #1d1d20;
    --surface-2: #26262a;
    --line: #2f2f34;
    --text: #ececef;
    --text-2: #a5a5ad;
    --text-3: #75757d;
    --accent: #3cc79b;
    --accent-soft: rgba(60, 199, 155, .14);
    --on-accent: #0b1f18;
    --warn: #f0a24b;
    --warn-soft: rgba(240, 162, 75, .14);
    --danger: #f06b5c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141416; --surface: #1d1d20; --surface-2: #26262a; --line: #2f2f34;
  --text: #ececef; --text-2: #a5a5ad; --text-3: #75757d;
  --accent: #3cc79b; --accent-soft: rgba(60, 199, 155, .14); --on-accent: #0b1f18;
  --warn: #f0a24b; --warn-soft: rgba(240, 162, 75, .14); --danger: #f06b5c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom));
}
.num { font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

/* 頂部 */
header.top {
  position: sticky; top: 0; z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
header.top .wrap { display: flex; align-items: center; gap: 8px; height: 56px; }
.month { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; }
.month strong { font-size: 17px; min-width: 88px; text-align: center; white-space: nowrap; }
.icon-btn {
  width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent;
  display: grid; place-items: center; color: var(--text-2);
}
.icon-btn:active { background: var(--surface-2); }
.icon-btn svg { width: 20px; height: 20px; }
.demo-tag {
  font-size: 12px; color: var(--warn); background: var(--warn-soft);
  padding: 2px 8px; border-radius: 999px; white-space: nowrap;
}

main section[hidden] { display: none; }
.block { margin-top: 20px; }
.block h2 { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 0 0 10px; }

/* 總覽 */
.hero { padding-top: 24px; }
.hero .label { color: var(--text-2); font-size: 14px; }
.hero .total { font-size: 40px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; margin: 2px 0 6px; }
.hero .cmp { font-size: 14px; color: var(--text-2); }
.hero .cmp b { font-weight: 600; }
.up { color: var(--danger); }
.down { color: var(--accent); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.stat span { display: block; font-size: 13px; color: var(--text-2); }
.stat b { font-size: 20px; font-weight: 650; }

.pending-banner {
  display: flex; align-items: center; gap: 10px; width: 100%;
  margin-top: 16px; padding: 12px 14px; border-radius: var(--radius);
  background: var(--warn-soft); color: var(--text); border: 0; text-align: left;
}
.pending-banner svg { width: 20px; height: 20px; color: var(--warn); flex: none; }
.pending-banner span { flex: 1; }
.pending-banner b { color: var(--warn); }

.cats { display: grid; gap: 12px; }
.cat-row { display: grid; grid-template-columns: 72px 1fr auto; align-items: center; gap: 10px; font-size: 14px; }
.cat-row .bar { height: 10px; border-radius: 5px; background: var(--accent); min-width: 3px; }
.cat-row .bar.dim { opacity: .45; }
.cat-row .v { color: var(--text-2); text-align: right; min-width: 84px; }

.daily { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 12px 8px; }
.daily svg { display: block; width: 100%; height: 140px; }
.daily .axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); padding: 4px 2px 0; }

/* 明細列表 */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.day-head {
  display: flex; justify-content: space-between; padding: 10px 14px 6px;
  font-size: 13px; color: var(--text-2); background: var(--surface-2);
}
.rec {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center;
  width: 100%; padding: 12px 14px; min-height: 56px; border: 0; background: transparent; text-align: left;
  border-top: 1px solid var(--line);
}
.day-head + .rec { border-top: 0; }
.rec:active { background: var(--surface-2); }
.rec .item { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rec .amt { font-weight: 600; text-align: right; }
.rec .meta { font-size: 13px; color: var(--text-3); }
.rec .badge { font-size: 12px; text-align: right; }
.rec.need .amt, .rec.need .badge, .rec.check .badge { color: var(--warn); }

.filters { display: flex; gap: 8px; overflow-x: auto; padding: 16px 0 4px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.chip {
  flex: none; height: 36px; padding: 0 14px; border-radius: 999px; font-size: 14px;
  border: 1px solid var(--line); background: var(--surface); color: var(--text-2);
}
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

.empty { text-align: center; color: var(--text-2); padding: 40px 16px; font-size: 14px; }
.empty b { display: block; color: var(--text); font-size: 16px; margin-bottom: 4px; }

/* 記一筆 */
.composer { margin-top: 20px; }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 13px; font-weight: 600; color: var(--text-2); }
.field .help { font-size: 13px; color: var(--text-3); }
input, select, textarea {
  width: 100%; min-height: 48px; padding: 10px 12px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface);
  font-size: 16px; /* 避免 iOS 放大 */
}
textarea { min-height: 96px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
.btn {
  height: 48px; padding: 0 20px; border-radius: 12px; border: 0;
  background: var(--accent); color: var(--on-accent); font-weight: 600; width: 100%;
  transition: transform .12s ease;
}
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .55; }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
.examples { display: flex; flex-wrap: wrap; gap: 8px; margin: -4px 0 16px; }
.examples .chip { height: 32px; font-size: 13px; }

.result { margin-top: 16px; display: grid; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.card .title { display: flex; justify-content: space-between; font-weight: 600; }
.card .sub { font-size: 13px; color: var(--text-2); margin-top: 2px; }
.card.warn { border-color: var(--warn); }
.card .note { font-size: 13px; color: var(--warn); margin-top: 6px; }
.msg { font-size: 14px; color: var(--text-2); }
.msg.err { color: var(--danger); }

/* 底部導覽 */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs .wrap { display: grid; grid-template-columns: repeat(3, 1fr); height: var(--nav-h); padding: 0; }
nav.tabs button {
  border: 0; background: transparent; color: var(--text-3);
  display: grid; place-items: center; align-content: center; gap: 2px; font-size: 12px;
}
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: var(--accent); font-weight: 600; }

/* 底部面板 */
.sheet-bg {
  position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .45);
  opacity: 0; pointer-events: none; transition: opacity .2s ease;
}
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 31;
  max-width: 560px; margin: 0 auto; max-height: 92dvh; overflow-y: auto;
  background: var(--bg); border-radius: 20px 20px 0 0;
  padding: 8px 16px calc(20px + env(safe-area-inset-bottom));
  transform: translateY(100%); transition: transform .28s cubic-bezier(.16, 1, .3, 1);
}
.sheet.open { transform: none; }
.sheet-bg.open { opacity: 1; pointer-events: auto; }
.sheet .grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 12px; }
.sheet h3 { margin: 0 0 4px; font-size: 18px; }
.sheet .raw { font-size: 13px; color: var(--text-2); background: var(--surface-2); padding: 10px 12px; border-radius: 10px; margin: 8px 0 16px; }
.sheet .raw b { color: var(--text); font-weight: 500; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 6px; }

/* 載入骨架 */
.skel { background: var(--surface-2); border-radius: 8px; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .5; } }
@media (prefers-reduced-motion: reduce) {
  .skel { animation: none; }
  .sheet, .sheet-bg, .btn { transition: none; }
}

.toast {
  position: fixed; left: 50%; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom)); z-index: 40;
  transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px);
  opacity: 0; transition: opacity .2s; pointer-events: none;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="month">
      <button class="icon-btn" id="prevM" aria-label="上個月">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <strong id="monthLabel" class="num">----</strong>
      <button class="icon-btn" id="nextM" aria-label="下個月">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
    <span class="demo-tag" id="demoTag" hidden>示範資料</span>
    <button class="icon-btn" id="refreshBtn" aria-label="重新整理">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button class="icon-btn" id="settingsBtn" aria-label="設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <!-- 總覽 -->
  <section id="view-overview">
    <div class="hero">
      <div class="label" id="totalLabel">本月支出</div>
      <div class="total num" id="total"><span class="skel" style="display:inline-block;width:180px;height:40px"></span></div>
      <div class="cmp num" id="cmp">&nbsp;</div>
      <div class="stats">
        <div class="stat"><span>今日</span><b class="num" id="todayAmt">-</b></div>
        <div class="stat"><span>日平均</span><b class="num" id="avgAmt">-</b></div>
      </div>
      <button class="pending-banner" id="pendingBanner" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        <span id="pendingText"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
    <div class="block">
      <h2>分類</h2>
      <div class="cats" id="cats"></div>
    </div>
    <div class="block">
      <h2>每日支出</h2>
      <div class="daily"><svg id="dailySvg" preserveAspectRatio="none" role="img" aria-label="本月每日支出長條圖"></svg><div class="axis num" id="dailyAxis"></div></div>
    </div>
    <div class="block">
      <h2>最近紀錄</h2>
      <div id="recent"></div>
    </div>
  </section>

  <!-- 明細 -->
  <section id="view-list" hidden>
    <div class="filters" id="statusFilters"></div>
    <div class="filters" id="catFilters" style="padding-top:4px"></div>
    <div class="block" style="margin-top:12px"><div id="fullList"></div></div>
  </section>

  <!-- 記一筆 -->
  <section id="view-add" hidden>
    <form class="composer" id="addForm">
      <div class="field">
        <label for="addText">口語輸入</label>
        <textarea id="addText" placeholder="晚餐雞腿飯一百二" autocomplete="off"></textarea>
        <span class="help">一句可以記多筆，也可以輸入「剛剛那筆改成 150」修改上一筆。</span>
      </div>
      <div class="examples" id="examples"></div>
      <button class="btn" id="addBtn" type="submit">送出</button>
    </form>
    <div class="result" id="addResult"></div>
  </section>
</main>

<nav class="tabs" aria-label="主要分頁">
  <div class="wrap">
    <button data-view="overview" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>總覽
    </button>
    <button data-view="list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>明細
    </button>
    <button data-view="add">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>記一筆
    </button>
  </div>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  // ---------- 設定（存在本機瀏覽器） ----------
  const store = {
    get(k) { try { return localStorage.getItem('ledger.' + k) || ''; } catch (e) { return ''; } },
    set(k, v) { try { localStorage.setItem('ledger.' + k, v); } catch (e) { /* 私密模式 */ } },
  };
  const cfg = () => ({ url: store.get('url'), read: store.get('read'), write: store.get('write') });
  const isDemo = () => !cfg().url || !cfg().read;

  const DEFAULT_CATS = ['餐飲', '交通', '購物', '生活日用', '娛樂', '醫療', '帳單', '其他'];
  const DEFAULT_PAYS = ['現金', '信用卡', '行動支付', '悠遊卡', '其他'];

  const state = {
    month: '', today: '', view: 'overview',
    records: [], prevRecords: [], pending: [],
    categories: DEFAULT_CATS, payments: DEFAULT_PAYS,
    filterStatus: '全部', filterCat: '全部',
    loading: false,
  };

  // ---------- 工具 ----------
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const money = n => '$' + Number(n || 0).toLocaleString('en-US');
  const pad = n => String(n).padStart(2, '0');
  const twToday = () => {
    const d = new Date(Date.now() + 8 * 3600e3);
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  };
  const shiftMonth = (ym, k) => {
    let y = +ym.slice(0, 4), m = +ym.slice(5, 7) + k;
    while (m < 1) { m += 12; y--; }
    while (m > 12) { m -= 12; y++; }
    return y + '-' + pad(m);
  };
  const daysIn = ym => new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0).getDate();
  const sum = list => list.reduce((s, r) => s + (r.amount || 0), 0);
  const weekday = d => '日一二三四五六'[new Date(d + 'T00:00:00').getDay()];

  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
  }

  // ---------- API ----------
  async function apiGet(params) {
    const c = cfg();
    const q = new URLSearchParams(Object.assign({ token: c.read || c.write }, params));
    const res = await fetch(c.url + '?' + q.toString(), { redirect: 'follow' });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error === 'unauthorized' ? 'Token 錯誤' : data.error);
    return data;
  }

  async function apiPost(body) {
    const c = cfg();
    if (!c.write) throw new Error('尚未設定寫入 Token');
    // 用 text/plain 避免 CORS preflight（Apps Script 不處理 OPTIONS）
    const res = await fetch(c.url, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ token: c.write }, body)),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error === 'unauthorized' ? '寫入 Token 錯誤' : data.error);
    return data;
  }

  // ---------- 示範資料（未設定時使用） ----------
  function demoData(month) {
    const today = twToday();
    const items = [
      ['餐飲', '蛋餅', 35], ['餐飲', '咖啡', 60], ['餐飲', '雞腿飯', 120], ['交通', '加油', 500],
      ['餐飲', '牛肉麵', 160], ['生活日用', '全聯', 486], ['娛樂', '電影', 330], ['餐飲', '便當', 95],
      ['帳單', '電話費', 599], ['購物', '球鞋', 2890], ['交通', '停車', 60], ['餐飲', '火鍋', 820],
    ];
    const n = month === today.slice(0, 7) ? +today.slice(8) : daysIn(month);
    const recs = [];
    let seed = month.split('-').reduce((a, b) => a + +b, 0);
    const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    for (let d = 1; d <= n; d++) {
      const k = 1 + Math.floor(rnd() * 3);
      for (let j = 0; j < k; j++) {
        const it = items[Math.floor(rnd() * items.length)];
        const date = month + '-' + pad(d);
        recs.push({ id: date + '-' + j, date, created: date + ' 12:00:00', category: it[0], item: it[1], amount: it[2],
          payment: rnd() > .7 ? '信用卡' : '現金', status: '已完成', confidence: '高', doubt: '',
          raw: it[1] + it[2], source: 'Tasks' });
      }
    }
    if (month === today.slice(0, 7)) {
      recs.push({ id: 'demo-p1', date: today, created: today + ' 09:10:00', category: '生活日用', item: '衛生紙', amount: null,
        payment: '現金', status: '待補金額', confidence: '高', doubt: '', raw: '買衛生紙', source: 'Tasks' });
      recs.push({ id: 'demo-p2', date: today, created: today + ' 19:42:00', category: '餐飲', item: '雞腿飯', amount: 120,
        payment: '現金', status: '待確認', confidence: '低', doubt: '金額原文「一伯二」推測 120', raw: '晚餐雞腿飯一伯二', source: 'Tasks' });
    }
    const prevM = shiftMonth(month, -1);
    const prev = [];
    for (let d = 1; d <= daysIn(prevM); d++) prev.push({ date: prevM + '-' + pad(d), amount: 300 + Math.floor(rnd() * 900) });
    return { month, today, records: recs, prevRecords: prev,
      pending: recs.filter(r => r.status === '待補金額' || r.status === '待確認'),
      categories: DEFAULT_CATS, payments: DEFAULT_PAYS };
  }

  // ---------- 載入 ----------
  async function load() {
    state.loading = true;
    $('demoTag').hidden = !isDemo();
    try {
      const data = isDemo() ? demoData(state.month) : await apiGet({ action: 'list', month: state.month });
      Object.assign(state, {
        today: data.today, records: data.records || [], prevRecords: data.prevRecords || [],
        pending: data.pending || [], categories: data.categories || DEFAULT_CATS, payments: data.payments || DEFAULT_PAYS,
      });
    } catch (e) {
      toast('讀取失敗：' + e.message);
      if (!state.today) state.today = twToday();
    }
    state.loading = false;
    render();
  }

  // ---------- 繪製 ----------
  function render() {
    $('monthLabel').textContent = state.month.replace('-', ' / ');
    $('nextM').disabled = state.month >= state.today.slice(0, 7);
    $('nextM').style.opacity = $('nextM').disabled ? .3 : 1;
    renderOverview();
    renderList();
  }

  function renderOverview() {
    const recs = state.records;
    const isCurrent = state.month === state.today.slice(0, 7);
    const total = sum(recs);
    $('totalLabel').textContent = isCurrent ? '本月支出' : state.month.slice(5).replace(/^0/, '') + ' 月支出';
    $('total').textContent = money(total);

    // 與上月同期比較：本月看到今天為止，過去月份看整月
    const upto = isCurrent ? +state.today.slice(8) : 31;
    const prevSame = sum(state.prevRecords.filter(r => +r.date.slice(8) <= upto));
    if (prevSame > 0) {
      const diff = total - prevSame;
      const pct = Math.round(Math.abs(diff) / prevSame * 100);
      $('cmp').innerHTML = (isCurrent ? '比上月同期 ' : '比上月 ') +
        '<b class="' + (diff > 0 ? 'up' : 'down') + '">' + (diff > 0 ? '多 ' : '少 ') + money(Math.abs(diff)) + '（' + pct + '%）</b>';
    } else {
      $('cmp').textContent = '上月沒有資料可比較';
    }

    $('todayAmt').textContent = isCurrent ? money(sum(recs.filter(r => r.date === state.today))) : '-';
    const days = isCurrent ? +state.today.slice(8) : daysIn(state.month);
    $('avgAmt').textContent = money(Math.round(total / Math.max(days, 1)));

    // 待處理（不分月份）
    const need = state.pending.filter(r => r.status === '待補金額').length;
    const check = state.pending.filter(r => r.status === '待確認').length;
    $('pendingBanner').hidden = !(need + check);
    $('pendingText').innerHTML = [need ? '<b>' + need + '</b> 筆待補金額' : '', check ? '<b>' + check + '</b> 筆待確認' : '']
      .filter(Boolean).join('、');

    // 分類
    const byCat = {};
    recs.forEach(r => { byCat[r.category] = (byCat[r.category] || 0) + (r.amount || 0); });
    const cats = Object.entries(byCat).filter(e => e[1] > 0).sort((a, b) => b[1] - a[1]);
    const max = cats.length ? cats[0][1] : 1;
    $('cats').innerHTML = cats.length ? cats.map(([c, v], i) =>
      '<div class="cat-row"><span>' + esc(c) + '</span>' +
      '<div><div class="bar' + (i ? ' dim' : '') + '" style="width:' + (v / max * 100).toFixed(1) + '%"></div></div>' +
      '<span class="v num">' + money(v) + ' · ' + Math.round(v / total * 100) + '%</span></div>').join('')
      : '<div class="empty"><b>這個月還沒有紀錄</b>對 Gemini 說「新增待辦，晚餐雞腿飯一百二」開始記帳</div>';

    // 每日長條
    const n = daysIn(state.month);
    const perDay = Array.from({ length: n }, (_, i) => sum(recs.filter(r => +r.date.slice(8) === i + 1)));
    const dmax = Math.max(...perDay, 1);
    const W = n * 10, H = 100;
    const todayIdx = isCurrent ? +state.today.slice(8) - 1 : -1;
    $('dailySvg').setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    $('dailySvg').innerHTML = perDay.map((v, i) => {
      const h = v ? Math.max(v / dmax * (H - 4), 2) : 0;
      const fill = i === todayIdx ? 'var(--accent)' : 'var(--text-3)';
      const op = i === todayIdx ? 1 : (i > todayIdx && isCurrent ? .15 : .55);
      return '<rect x="' + (i * 10 + 1.5) + '" y="' + (H - h) + '" width="7" height="' + h + '" rx="1.5" fill="' + fill + '" opacity="' + op + '"><title>' +
        (i + 1) + ' 日 ' + money(v) + '</title></rect>';
    }).join('');
    $('dailyAxis').innerHTML = '<span>1</span><span>' + Math.ceil(n / 2) + '</span><span>' + n + '</span>';

    // 最近
    const recent = [...recs].sort((a, b) => (b.created || '').localeCompare(a.created || '')).slice(0, 5);
    $('recent').innerHTML = recent.length ? '<div class="list">' + recent.map(recRow).join('') + '</div>' : '';
  }

  function recRow(r) {
    const cls = r.status === '待補金額' ? 'need' : r.status === '待確認' ? 'check' : '';
    const badge = cls ? '<span class="badge">' + esc(r.status) + '</span>' : '<span class="meta">' + esc(r.payment) + '</span>';
    return '<button class="rec ' + cls + '" data-id="' + esc(r.id) + '">' +
      '<span class="item">' + esc(r.item) + '</span>' +
      '<span class="amt num">' + (r.amount == null ? '未填' : money(r.amount)) + '</span>' +
      '<span class="meta">' + esc(r.category) + ' · ' + esc(r.date.slice(5).replace('-', '/')) + '</span>' + badge + '</button>';
  }

  function renderList() {
    const statuses = ['全部', '待處理', '已完成'];
    $('statusFilters').innerHTML = statuses.map(s =>
      '<button class="chip" data-fs="' + s + '" aria-pressed="' + (state.filterStatus === s) + '">' + s +
      (s === '待處理' && state.pending.length ? ' ' + state.pending.length : '') + '</button>').join('');
    $('catFilters').innerHTML = ['全部'].concat(state.categories).map(c =>
      '<button class="chip" data-fc="' + esc(c) + '" aria-pressed="' + (state.filterCat === c) + '">' + esc(c) + '</button>').join('');

    // 「待處理」跨月份顯示，其他篩選只看本月
    let list = state.filterStatus === '待處理' ? state.pending.slice() : state.records.slice();
    if (state.filterStatus === '已完成') list = list.filter(r => r.status === '已完成');
    if (state.filterCat !== '全部') list = list.filter(r => r.category === state.filterCat);
    list.sort((a, b) => b.date.localeCompare(a.date) || (b.created || '').localeCompare(a.created || ''));

    if (!list.length) {
      $('fullList').innerHTML = '<div class="empty"><b>沒有符合的紀錄</b>換個篩選條件看看</div>';
      return;
    }
    let html = '<div class="list">', cur = '';
    list.forEach(r => {
      if (r.date !== cur) {
        cur = r.date;
        const dayTotal = sum(list.filter(x => x.date === cur));
        html += '<div class="day-head num"><span>' + cur.slice(5).replace('-', '/') + '（' + weekday(cur) + '）</span><span>' + money(dayTotal) + '</span></div>';
      }
      html += recRow(r);
    });
    $('fullList').innerHTML = html + '</div>';
  }

  // ---------- 編輯面板 ----------
  function findRec(id) {
    return state.records.find(r => r.id === id) || state.pending.find(r => r.id === id);
  }

  function openSheet(html) {
    $('sheet').innerHTML = '<div class="grip"></div>' + html;
    $('sheet').classList.add('open');
    $('sheetBg').classList.add('open');
  }
  function closeSheet() {
    $('sheet').classList.remove('open');
    $('sheetBg').classList.remove('open');
  }

  function openEdit(id) {
    const r = findRec(id);
    if (!r) return;
    const opts = (list, v) => list.map(x => '<option' + (x === v ? ' selected' : '') + '>' + esc(x) + '</option>').join('');
    openSheet(
      '<h3 id="sheetTitle">編輯紀錄</h3>' +
      '<div class="raw">原始輸入：<b>' + esc(r.raw) + '</b>' + (r.doubt ? '<br>疑點：' + esc(r.doubt) : '') + '</div>' +
      '<form id="editForm">' +
      '<div class="row2"><div class="field"><label for="eDate">日期</label><input id="eDate" type="date" value="' + esc(r.date) + '" required></div>' +
      '<div class="field"><label for="eAmt">金額（元）</label><input id="eAmt" type="number" inputmode="numeric" min="1" step="1" value="' + (r.amount == null ? '' : r.amount) + '" placeholder="未填"></div></div>' +
      '<div class="field"><label for="eItem">品項</label><input id="eItem" value="' + esc(r.item) + '" required></div>' +
      '<div class="row2"><div class="field"><label for="eCat">分類</label><select id="eCat">' + opts(state.categories, r.category) + '</select></div>' +
      '<div class="field"><label for="ePay">付款方式</label><select id="ePay">' + opts(state.payments, r.payment) + '</select></div></div>' +
      '<p class="msg err" id="editErr" hidden></p>' +
      '<div class="actions"><button type="button" class="btn danger" id="delBtn">刪除</button><button class="btn" id="saveBtn">儲存</button></div>' +
      '</form>');

    $('editForm').onsubmit = async e => {
      e.preventDefault();
      const amtRaw = $('eAmt').value.trim();
      const fields = { date: $('eDate').value, amount: amtRaw === '' ? null : Number(amtRaw),
        item: $('eItem').value.trim(), category: $('eCat').value, payment: $('ePay').value };
      if (fields.amount !== null && (!Number.isInteger(fields.amount) || fields.amount <= 0)) {
        return showErr('金額需為正整數');
      }
      await mutate($('saveBtn'), '儲存中…', async () => {
        if (!isDemo()) await apiPost({ action: 'update', id: r.id, fields });
        else Object.assign(r, fields, { status: fields.amount == null ? '待補金額' : '已完成', doubt: '' });
        toast('已儲存');
      });
    };
    $('delBtn').onclick = async () => {
      if ($('delBtn').dataset.confirm !== '1') {
        $('delBtn').dataset.confirm = '1';
        $('delBtn').textContent = '再按一次';
        return;
      }
      await mutate($('delBtn'), '刪除中…', async () => {
        if (!isDemo()) await apiPost({ action: 'delete', id: r.id });
        else state.records = state.records.filter(x => x !== r);
        toast('已刪除');
      });
    };
  }

  function showErr(msg) { const el = $('editErr'); el.textContent = msg; el.hidden = false; }

  async function mutate(btn, label, fn) {
    const old = btn.textContent;
    btn.disabled = true; btn.textContent = label;
    try {
      await fn();
      closeSheet();
      if (isDemo()) {
        state.pending = state.records.filter(r => r.status === '待補金額' || r.status === '待確認');
        render();
      } else {
        await load();
      }
    } catch (e) {
      showErr(e.message);
      btn.disabled = false; btn.textContent = old;
    }
  }

  // ---------- 記一筆 ----------
  const EXAMPLES = ['晚餐雞腿飯一百二', '早餐蛋餅35 咖啡60', '昨天加油五百', '剛剛那筆改成150'];
  $('examples').innerHTML = EXAMPLES.map(t => '<button type="button" class="chip">' + esc(t) + '</button>').join('');
  $('examples').onclick = e => {
    if (e.target.matches('.chip')) { $('addText').value = e.target.textContent; $('addText').focus(); }
  };

  $('addForm').onsubmit = async e => {
    e.preventDefault();
    const text = $('addText').value.trim();
    if (!text) return;
    if (isDemo()) {
      $('addResult').innerHTML = '<p class="msg err">示範模式無法送出，請先到設定填入 Apps Script 網址與 Token。</p>';
      return;
    }
    const btn = $('addBtn');
    btn.disabled = true; btn.textContent = '解析中…';
    $('addResult').innerHTML = '<div class="card"><div class="skel" style="height:18px;width:60%"></div><div class="skel" style="height:14px;width:40%;margin-top:8px"></div></div>';
    try {
      const data = await apiPost({ action: 'add', text });
      if (data.action === 'ignore') {
        $('addResult').innerHTML = '<p class="msg">沒有入帳：' + esc(data.reason) + '</p>';
      } else {
        const head = data.action === 'amend_last' ? '已修改上一筆' : '已入帳 ' + data.records.length + ' 筆';
        $('addResult').innerHTML = '<p class="msg">' + head + '</p>' + data.records.map(r =>
          '<div class="card' + (r.status !== '已完成' ? ' warn' : '') + '">' +
          '<div class="title"><span>' + esc(r.item) + '</span><span class="num">' + (r.amount == null ? '缺金額' : money(r.amount)) + '</span></div>' +
          '<div class="sub">' + esc(r.category) + ' · ' + esc(r.date) + ' · ' + esc(r.payment) + '</div>' +
          (r.status !== '已完成' ? '<div class="note">' + esc(r.status) + (r.doubt ? '：' + esc(r.doubt) : '') + '</div>' : '') +
          '</div>').join('');
        $('addText').value = '';
        load();
      }
    } catch (err) {
      $('addResult').innerHTML = '<p class="msg err">失敗：' + esc(err.message) + '</p>';
    }
    btn.disabled = false; btn.textContent = '送出';
  };

  // ---------- 設定 ----------
  function openSettings() {
    const c = cfg();
    openSheet(
      '<h3 id="sheetTitle">連線設定</h3>' +
      '<p class="msg" style="margin:4px 0 16px">只存在這台裝置的瀏覽器，不會上傳到 GitHub。</p>' +
      '<form id="setForm">' +
      '<div class="field"><label for="sUrl">Apps Script 網址</label><input id="sUrl" type="url" value="' + esc(c.url) + '" placeholder="https://script.google.com/macros/s/…/exec"></div>' +
      '<div class="field"><label for="sRead">讀取 Token</label><input id="sRead" value="' + esc(c.read) + '" autocomplete="off"></div>' +
      '<div class="field"><label for="sWrite">寫入 Token</label><input id="sWrite" value="' + esc(c.write) + '" autocomplete="off"><span class="help">只想看帳可以留空，就無法記帳與編輯。</span></div>' +
      '<p class="msg err" id="editErr" hidden></p>' +
      '<div class="actions"><button type="button" class="btn ghost" id="clearBtn">清除</button><button class="btn" id="testBtn">測試並儲存</button></div>' +
      '</form>');

    $('setForm').onsubmit = async e => {
      e.preventDefault();
      const url = $('sUrl').value.trim(), read = $('sRead').value.trim(), write = $('sWrite').value.trim();
      if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)) return showErr('網址格式應為 https://script.google.com/macros/s/…/exec');
      if (!read) return showErr('請填讀取 Token');
      const btn = $('testBtn');
      btn.disabled = true; btn.textContent = '連線中…';
      const old = cfg();
      store.set('url', url); store.set('read', read); store.set('write', write);
      try {
        await apiGet({ action: 'ping' });
        closeSheet();
        toast('連線成功');
        load();
      } catch (err) {
        store.set('url', old.url); store.set('read', old.read); store.set('write', old.write);
        showErr('連線失敗：' + err.message);
        btn.disabled = false; btn.textContent = '測試並儲存';
      }
    };
    $('clearBtn').onclick = () => {
      ['url', 'read', 'write'].forEach(k => store.set(k, ''));
      closeSheet();
      toast('已清除，改為示範資料');
      load();
    };
  }

  // ---------- 事件 ----------
  function setView(v) {
    state.view = v;
    ['overview', 'list', 'add'].forEach(x => { $('view-' + x).hidden = x !== v; });
    document.querySelectorAll('nav.tabs button').forEach(b => {
      if (b.dataset.view === v) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    window.scrollTo(0, 0);
  }

  document.querySelector('nav.tabs').onclick = e => {
    const b = e.target.closest('button');
    if (b) setView(b.dataset.view);
  };
  document.body.addEventListener('click', e => {
    const rec = e.target.closest('.rec');
    if (rec) return openEdit(rec.dataset.id);
    const fs = e.target.closest('[data-fs]');
    if (fs) { state.filterStatus = fs.dataset.fs; return renderList(); }
    const fc = e.target.closest('[data-fc]');
    if (fc) { state.filterCat = fc.dataset.fc; return renderList(); }
  });
  $('pendingBanner').onclick = () => { state.filterStatus = '待處理'; state.filterCat = '全部'; renderList(); setView('list'); };
  $('prevM').onclick = () => { state.month = shiftMonth(state.month, -1); load(); };
  $('nextM').onclick = () => { if (state.month < state.today.slice(0, 7)) { state.month = shiftMonth(state.month, 1); load(); } };
  $('refreshBtn').onclick = () => load();
  $('settingsBtn').onclick = openSettings;
  $('sheetBg').onclick = closeSheet;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

  // ---------- 啟動 ----------
  state.today = twToday();
  state.month = state.today.slice(0, 7);
  if (isDemo()) setTimeout(() => toast('目前是示範資料，按右上角設定連線'), 600);
  load();
})();
</script>
</body>
</html>
