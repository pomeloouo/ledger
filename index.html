<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  // ---------- 設定（存在本機瀏覽器） ----------
  const store = {
    get(k) { try { return localStorage.getItem('ledger.' + k) || ''; } catch (e) { return ''; } },
    set(k, v) { try { localStorage.setItem('ledger.' + k, v); } catch (e) { /* 私密模式 */ } },
  };
  const cfg = () => ({ url: store.get('url'), read: store.get('read'), write: store.get('write') });
  const isDemo = () => !cfg().url || !cfg().read;

  const DEFAULT_CATS = ['餐飲', '交通', '購物', '生活日用', '娛樂', '醫療', '帳單', '其他'];
  const DEFAULT_PAYS = ['現金', '信用卡', '行動支付', '悠遊卡', '其他'];

  const state = {
    anchor: '', today: '', view: 'overview', assets: null,
    cycle: null, prevCycle: null, records: [], prevRecords: [], pending: [],
    incomes: [], transfers: [], budget: null, version: null, schedule: null, holidayWarning: '',
    categories: DEFAULT_CATS, payments: DEFAULT_PAYS,
    filterStatus: '全部', filterCat: '全部',
    expanded: new Set(), last: null,
    loading: false,
  };

  // ---------- 工具 ----------
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const money = n => '$' + Number(n || 0).toLocaleString('en-US');
  const pad = n => String(n).padStart(2, '0');
  const twToday = () => {
    const d = new Date(Date.now() + 8 * 3600e3);
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  };
  const daysIn = ym => new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0).getDate();
  const addDays = (ymd, n) => new Date(Date.UTC(+ymd.slice(0, 4), +ymd.slice(5, 7) - 1, +ymd.slice(8, 10) + n)).toISOString().slice(0, 10);
  const daysBetween = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5);
  const md = ymd => +ymd.slice(5, 7) + '/' + +ymd.slice(8, 10);
  const sum = list => list.reduce((s, r) => s + (r.amount || 0), 0);
  const weekday = d => '日一二三四五六'[new Date(d + 'T00:00:00').getDay()];

  // 刪除類按鈕：第一次按變成「再按一次」，3 秒內沒按就恢復原樣
  function confirmTwice(btn) {
    if (btn.dataset.confirm === '1') return true;
    const old = btn.textContent;
    btn.dataset.confirm = '1';
    btn.textContent = '再按一次';
    setTimeout(() => {
      if (btn.dataset.confirm === '1' && !btn.disabled) { btn.dataset.confirm = ''; btn.textContent = old; }
    }, 3000);
    return false;
  }

  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
  }

  // ---------- API ----------
  // 讀取也用 POST：Token 放在內容裡，不會出現在網址與瀏覽紀錄
  async function apiGet(params) {
    const c = cfg();
    const res = await fetch(c.url, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ token: c.read || c.write }, params)),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error === 'unauthorized' ? 'Token 錯誤（若 Token 沒錯，代表後端還是舊版，請重新部署「新版本」）' : data.error);
    return data;
  }

  async function apiPost(body) {
    const c = cfg();
    if (!c.write) throw new Error('尚未設定寫入 Token');
    // 用 text/plain 避免 CORS preflight（Apps Script 不處理 OPTIONS）
    const res = await fetch(c.url, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ token: c.write }, body)),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error === 'unauthorized' ? '寫入 Token 錯誤' : data.error);
    return data;
  }

  // ---------- 示範資料（未設定時使用） ----------
  // 2026 年平日放假日（補假、國定假日），示範用；正式資料由後端的「假日」工作表決定
  const DEMO_OFF = ['2026-01-01', '2026-02-16', '2026-02-17', '2026-02-18', '2026-02-19', '2026-02-20', '2026-02-27',
    '2026-04-03', '2026-04-06', '2026-05-01', '2026-06-19', '2026-09-25', '2026-09-28', '2026-10-09', '2026-10-26', '2026-12-25'];
  const DEMO_BUCKETS = [
    { name: '生活必要', type: '消費', pct: 30, cats: ['餐飲'] },
    { name: '其他', type: '消費', pct: 15, cats: ['交通', '購物', '生活日用', '醫療', '帳單', '其他'] },
    { name: '娛樂', type: '消費', pct: 25, cats: ['娛樂'] },
    { name: '投資', type: '轉存', pct: 30, cats: [] },
  ];
  const demo = { version: { start: '', buckets: DEMO_BUCKETS }, transfers: [], records: null, incomes: null };

  function demoOff(ymd) {
    const w = new Date(ymd + 'T00:00:00Z').getUTCDay();
    return w === 0 || w === 6 || DEMO_OFF.indexOf(ymd) >= 0;
  }
  function demoSched(y, m, day) {
    let d = y + '-' + pad(m) + '-' + pad(Math.min(day, new Date(Date.UTC(y, m, 0)).getUTCDate()));
    while (demoOff(d)) d = addDays(d, -1);
    return d;
  }
  function demoCycle(ymd) {
    const y = +ymd.slice(0, 4), m = +ymd.slice(5, 7);
    const first = k => { const t = y * 12 + m - 1 + k; return Math.floor(t / 12) + '-' + pad(t % 12 + 1) + '-01'; };
    const start = first(0), nextStart = first(1);
    return { start, end: addDays(nextStart, -1), nextStart, prevStart: first(-1), days: daysBetween(start, nextStart), month: start.slice(0, 7) };
  }
  function demoRecords(c, today) {
    const items = [
      ['餐飲', '蛋餅', 35], ['餐飲', '咖啡', 60], ['餐飲', '雞腿飯', 120], ['交通', '加油', 500],
      ['餐飲', '牛肉麵', 160], ['生活日用', '全聯', 486], ['娛樂', '電影', 330], ['餐飲', '便當', 95],
      ['帳單', '電話費', 599], ['購物', '球鞋', 2890], ['交通', '停車', 60], ['餐飲', '火鍋', 820],
    ];
    const recs = [];
    let seed = c.start.split('-').reduce((a, b) => a + +b, 0);
    const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    for (let d = c.start; d <= c.end && d <= today; d = addDays(d, 1)) {
      const k = Math.floor(rnd() * 3);
      for (let j = 0; j < k; j++) {
        const it = items[Math.floor(rnd() * items.length)];
        recs.push({ id: d + '-' + j, date: d, created: d + ' 12:0' + j + ':00', category: it[0], item: it[1], amount: it[2],
          payment: rnd() > .7 ? '信用卡' : '現金', status: '已完成', confidence: '高', doubt: '', raw: it[1] + it[2], source: 'Tasks' });
      }
    }
    return recs;
  }
  function demoBudget(c, version, records, prevIncomes, transfers) {
    const base = sum(prevIncomes);
    const noBase = base <= 0;
    const owner = {};
    version.buckets.forEach(b => { if (b.type === '消費') b.cats.forEach(x => { owner[x] = b.name; }); });
    return {
      base, noBase, baseMonth: c.prevStart.slice(0, 7),
      buckets: version.buckets.map(b => ({ name: b.name, type: b.type, pct: b.pct, cats: b.cats, limit: noBase ? null : Math.round(base * b.pct / 100),
        used: b.type === '消費' ? sum(records.filter(r => owner[r.category] === b.name)) : sum(transfers.filter(t => t.bucket === b.name)) })),
      unassigned: { cats: DEFAULT_CATS.filter(x => !owner[x]), used: sum(records.filter(r => !owner[r.category])) },
    };
  }
  function demoIncomes(today) {
    if (demo.incomes) return demo.incomes;
    const list = [];
    const t0 = +today.slice(0, 4) * 12 + +today.slice(5, 7) - 1;
    for (let k = 3; k >= 0; k--) {
      const t = t0 - k, y = Math.floor(t / 12), m = t % 12 + 1;
      const pay = demoSched(y, m, 10), bonus = demoSched(y, m, 25);
      if (pay <= today) list.push({ id: 'demo-s' + k, item: '薪資', amount: 41000 + k * 370, date: pay, note: '', source: '網頁' });
      if (bonus <= today && k % 2 === 1) list.push({ id: 'demo-b' + k, item: '獎金', amount: 6500, date: bonus, note: '', source: '網頁' });
    }
    demo.incomes = list;
    return list;
  }
  function demoData(anchor) {
    const today = twToday();
    const c = demoCycle(anchor || today);
    const isCurrent = c.start <= today && today <= c.end;
    const prev = demoCycle(c.prevStart);
    let records = demoRecords(c, today);
    if (isCurrent) {
      if (!demo.records) {
        demo.records = records.concat([
          { id: 'demo-p1', date: today, created: today + ' 09:10:00', category: '生活日用', item: '衛生紙', amount: null,
            payment: '現金', status: '待補金額', confidence: '高', doubt: '', raw: '買衛生紙', source: 'Tasks' },
          { id: 'demo-p2', date: today, created: today + ' 19:42:00', category: '餐飲', item: '雞腿飯', amount: 120,
            payment: '現金', status: '待確認', confidence: '低', doubt: '金額原文「一伯二」推測 120', raw: '晚餐雞腿飯一伯二', source: 'Tasks' },
        ]);
        demo.transfers = [{ id: 'demo-t1', date: c.start, bucket: '投資', amount: 5000, note: '定期定額' }];
      }
      records = demo.records;
    }
    const allInc = demoIncomes(today);
    const incomes = allInc.filter(x => x.date >= c.start && x.date <= c.end);
    const prevIncomes = allInc.filter(x => x.date >= prev.start && x.date <= prev.end);
    const transfers = isCurrent ? demo.transfers : [];
    const nextOf = day => { for (let k = 0; k < 3; k++) { const t = (+today.slice(0, 4)) * 12 + +today.slice(5, 7) - 1 + k; const d = demoSched(Math.floor(t / 12), t % 12 + 1, day); if (d >= today) return d; } return ''; };
    const cardDate = (() => { const y0 = +today.slice(0, 4), m0 = +today.slice(5, 7); const d = y0 + '-' + pad(m0) + '-12'; if (d >= today) return d; const t = y0 * 12 + m0; return Math.floor(t / 12) + '-' + pad(t % 12 + 1) + '-12'; })();
    const sch = d => ({ date: d, daysLeft: daysBetween(today, d) });
    return {
      today,
      cycle: Object.assign({}, c, { isCurrent, daysLeft: isCurrent ? daysBetween(today, c.end) + 1 : 0 }),
      prevCycle: { start: prev.start, end: prev.end },
      records,
      prevRecords: demoRecords(prev, today).map(r => ({ date: r.date, amount: r.amount })),
      pending: (isCurrent ? records : demo.records || []).filter(r => r.status === '待補金額' || r.status === '待確認'),
      incomes, transfers,
      budget: demoBudget(c, demo.version, records, prevIncomes, transfers),
      version: demo.version, editableFrom: demoCycle(today).start,
      schedule: { salary: sch(nextOf(10)), bonus: sch(nextOf(25)), card: Object.assign(sch(cardDate), { remind: daysBetween(today, cardDate) <= 3 }) },
      holidayWarning: '', categories: DEFAULT_CATS, payments: DEFAULT_PAYS,
      last: (demo.records || records).slice(-1)[0] || null,
    };
  }

  // ---------- 載入 ----------
  async function load() {
    state.loading = true;
    $('demoTag').hidden = !isDemo();
    try {
      const data = isDemo() ? demoData(state.anchor) : await apiGet({ action: 'list', date: state.anchor });
      if (!data.cycle) throw new Error('後端還是舊版程式。請到 Apps Script「部署 → 管理部署作業 → 編輯 → 版本選新版本 → 部署」');
      Object.assign(state, {
        today: data.today, cycle: data.cycle, prevCycle: data.prevCycle,
        records: data.records || [], prevRecords: data.prevRecords || [], pending: data.pending || [],
        incomes: data.incomes || [], transfers: data.transfers || [], budget: data.budget, version: data.version,
        editableFrom: data.editableFrom, schedule: data.schedule, holidayWarning: data.holidayWarning || '',
        categories: data.categories || DEFAULT_CATS, payments: data.payments || DEFAULT_PAYS,
        last: data.last || null,
      });
      state.anchor = data.cycle.start;
    } catch (e) {
      toast('讀取失敗：' + e.message);
      if (!state.today) state.today = twToday();
    }
    state.loading = false;
    render();
  }

  // ---------- 繪製 ----------
  function render() {
    if (!state.cycle) return;
    const c = state.cycle;
    $('monthLabel').textContent = c.start.slice(0, 4) + ' 年 ' + +c.start.slice(5, 7) + ' 月';
    $('nextM').disabled = c.nextStart > state.today;
    $('nextM').style.opacity = $('nextM').disabled ? .3 : 1;
    renderOverview();
    renderList();
    renderLastLine();
  }

  // 「剛剛那筆改成…」會改到的那一筆，先讓使用者看到
  function renderLastLine() {
    const l = state.last;
    $('lastLine').hidden = !l;
    if (l) $('lastLine').textContent = '上一筆：' + l.item + ' ' + (l.amount == null ? '（缺金額）' : money(l.amount)) + '・' + l.category + '・' + md(l.date);
  }

  function renderOverview() {
    const c = state.cycle;
    const recs = state.records;
    const total = sum(recs);
    const b = state.budget;
    $('totalLabel').textContent = c.isCurrent ? '本月支出' : +c.start.slice(5, 7) + ' 月支出';
    $('total').textContent = money(total);

    // 與上個月同樣經過天數比較
    const elapsed = c.isCurrent ? daysBetween(c.start, state.today) : c.days - 1;
    const pc = state.prevCycle;
    const prevSame = pc ? sum(state.prevRecords.filter(r => daysBetween(pc.start, r.date) <= elapsed)) : 0;
    if (prevSame > 0) {
      const diff = total - prevSame;
      const pct = Math.round(Math.abs(diff) / prevSame * 100);
      $('cmp').innerHTML = (c.isCurrent ? '比上月同期 ' : '比上月 ') +
        '<b class="' + (diff > 0 ? 'up' : 'down') + '">' + (diff > 0 ? '多 ' : '少 ') + money(Math.abs(diff)) + '（' + pct + '%）</b>';
    } else {
      $('cmp').textContent = '上個月沒有資料可比較';
    }

    // 今天還能花：今天開始時的每日額度 − 今天已花。
    // 今天開始時的剩餘額度 = 現在剩餘 + 今天已花，再平均到剩餘天數（含今天）。
    const spendB = b ? b.buckets.filter(x => x.type === '消費') : [];
    const leftAll = spendB.reduce((s, x) => s + (x.limit - x.used), 0) - (b ? b.unassigned.used : 0);
    const todaySpent = c.isCurrent ? sum(recs.filter(r => r.date === state.today)) : 0;
    $('todayLeft').className = 'num';
    if (b && b.noBase) {
      $('todayLeft').textContent = '-';
      $('todayLeftNote').textContent = '上月沒有收入紀錄';
    } else if (c.isCurrent && c.daysLeft) {
      const dayBudget = Math.floor(Math.max(leftAll + todaySpent, 0) / c.daysLeft);
      const canSpend = dayBudget - todaySpent;
      $('todayLeft').textContent = signed(canSpend);
      if (canSpend < 0) $('todayLeft').className = 'num up';
      $('todayLeftNote').textContent = leftAll < 0 ? '本月消費預算已超支 ' + money(-leftAll)
        : canSpend < 0 ? '今天超出 ' + money(-canSpend) + '，之後每天會變少'
        : '今天額度 ' + money(dayBudget) + '，剩 ' + c.daysLeft + ' 天';
    } else {
      $('todayLeft').textContent = '-';
      $('todayLeftNote').textContent = '過去月份';
    }
    $('todayAmt').textContent = c.isCurrent ? money(todaySpent) : '-';
    const incomeSum = sum(state.incomes);
    const transferSum = sum(state.transfers);
    $('incomeAmt').textContent = money(incomeSum);
    $('incomeNote').textContent = (state.incomes.length ? state.incomes.length + ' 筆' : (c.isCurrent ? '還沒輸入' : '沒有紀錄')) +
      '，成為 ' + +c.nextStart.slice(5, 7) + ' 月額度';
    // 本月剩餘：和預算同一筆錢（上月收入），不用本月收入，避免發薪前一直是負數
    if (b && !b.noBase) {
      const bal = b.base - total - transferSum;
      $('balanceAmt').textContent = signed(bal);
      $('balanceAmt').className = 'num' + (bal < 0 ? ' up' : '');
      $('balanceNote').textContent = +b.baseMonth.slice(5, 7) + ' 月收入－支出－轉存';
    } else {
      $('balanceAmt').textContent = '-';
      $('balanceAmt').className = 'num';
      $('balanceNote').textContent = '上月沒有收入紀錄';
    }

    // 待處理
    const need = state.pending.filter(r => r.status === '待補金額').length;
    const check = state.pending.filter(r => r.status === '待確認').length;
    $('pendingBanner').hidden = !(need + check);
    $('pendingText').innerHTML = [need ? '<b>' + need + '</b> 筆待補金額' : '', check ? '<b>' + check + '</b> 筆待確認' : '']
      .filter(Boolean).join('、');

    renderSchedule();
    renderBudget();

    // 每日長條（整個月）
    const n = c.days;
    const perDay = Array.from({ length: n }, (_, i) => { const d = addDays(c.start, i); return sum(recs.filter(r => r.date === d)); });
    const dmax = Math.max(...perDay, 1);
    const W = n * 10, H = 100;
    const todayIdx = c.isCurrent ? daysBetween(c.start, state.today) : -1;
    $('dailySvg').setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    $('dailySvg').innerHTML = perDay.map((v, i) => {
      const h = v ? Math.max(v / dmax * (H - 4), 2) : 0;
      const fill = i === todayIdx ? 'var(--accent)' : 'var(--text-3)';
      const op = i === todayIdx ? 1 : (c.isCurrent && i > todayIdx ? .15 : .55);
      return '<rect x="' + (i * 10 + 1.5) + '" y="' + (H - h) + '" width="7" height="' + h + '" rx="1.5" fill="' + fill + '" opacity="' + op + '"><title>' +
        md(addDays(c.start, i)) + ' ' + money(v) + '</title></rect>';
    }).join('');
    $('dailyAxis').innerHTML = '<span>' + md(c.start) + '</span><span>' + md(addDays(c.start, Math.floor(n / 2))) + '</span><span>' + md(c.end) + '</span>';

    // 最近
    const recent = [...recs].sort((a, b2) => (b2.created || '').localeCompare(a.created || '')).slice(0, 5);
    $('recent').innerHTML = recent.length ? '<div class="list">' + recent.map(recRow).join('') + '</div>'
      : '<div class="empty"><b>這個月還沒有紀錄</b>對 Gemini 說「新增待辦，晚餐雞腿飯一百二」開始記帳</div>';
  }

  // 預算類別展開後的各分類金額（取代原本獨立的「分類」區塊）
  function catBreakdown(cats) {
    const recs = state.records;
    const rows = cats.map(cat => [cat, sum(recs.filter(r => r.category === cat))])
      .filter(x => x[1] > 0).sort((a, b2) => b2[1] - a[1]);
    if (!rows.length) return '<span class="cat-list"><span class="cat-row"><span>這個月還沒有支出</span></span></span>';
    const max = rows[0][1];
    return '<span class="cat-list">' + rows.map(([cat, v]) =>
      '<span class="cat-row"><span>' + esc(cat) + '</span>' +
      '<span><span class="bar" style="display:block;width:' + (v / max * 100).toFixed(1) + '%"></span></span>' +
      '<span class="v num">' + money(v) + '</span></span>').join('') + '</span>';
  }

  function renderSchedule() {
    const s = state.schedule;
    if (!s) { $('sched').innerHTML = ''; return; }
    const cell = (label, x, hot) => {
      if (!x || !x.date) return '<div><span>' + label + '</span><b>-</b></div>';
      const left = x.daysLeft === 0 ? (label === '信用卡繳費' ? '今天' : '今天，記得輸入金額') : x.daysLeft + ' 天後';
      return '<div class="' + (hot ? 'hot' : '') + '"><span>' + label + '</span><b class="num">' + md(x.date) + '</b><small>週' + weekday(x.date) + '・' + left + '</small></div>';
    };
    $('sched').innerHTML = cell('發薪', s.salary, s.salary && s.salary.daysLeft === 0) + cell('獎金', s.bonus, s.bonus && s.bonus.daysLeft === 0) + cell('信用卡繳費', s.card, s.card && s.card.remind);
  }

  function renderBudget() {
    const b = state.budget;
    if (!b) { $('budget').innerHTML = ''; return; }
    const c = state.cycle;
    // 消費型類別：點一下展開，看裡面各分類花了多少
    const spendRow = (key, cls, inner, cats) => {
      const open = state.expanded.has(key);
      return '<button class="bud' + cls + '" data-bucket="' + esc(key) + '" aria-expanded="' + open + '">' + inner +
        (open ? catBreakdown(cats) : '') + '</button>';
    };
    const rows = b.buckets.map(x => {
      if (b.noBase) {
        const inner = '<span class="name">' + esc(x.name) + '<small>' + x.pct + '%・' + (x.type === '轉存' ? '轉存' : esc(x.cats.join('、'))) + '</small></span>' +
          '<span class="fig num">' + money(x.used) + '</span>' +
          '<span class="sub">' + (x.type === '轉存' ? '已轉存，點這裡記一筆' : '已花・點這裡看各分類') + '</span>';
        return x.type === '轉存' ? '<button class="bud" data-transfer="' + esc(x.name) + '">' + inner + '</button>' : spendRow(x.name, '', inner, x.cats);
      }
      const ratio = x.limit ? x.used / x.limit : (x.used ? 2 : 0);
      if (x.type === '轉存') {
        const done = x.used >= x.limit;
        return '<button class="bud" data-transfer="' + esc(x.name) + '">' +
          '<span class="name">' + esc(x.name) + '<small>' + x.pct + '%・轉存</small></span>' +
          '<span class="fig num">' + money(x.used) + '<small> / ' + money(x.limit) + '</small></span>' +
          '<span class="track"><span class="fill" style="display:block;width:' + Math.min(ratio * 100, 100).toFixed(1) + '%"></span></span>' +
          '<span class="sub">' + (done ? '本月目標已達成' : '還差 <b>' + money(x.limit - x.used) + '</b>，點這裡記一筆轉存') + '</span></button>';
      }
      const left = x.limit - x.used;
      const cls = ratio >= 1 ? ' over' : ratio >= .8 ? ' warn' : '';
      const perDay = c.isCurrent && c.daysLeft && left > 0 ? '，每天約 ' + money(Math.floor(left / c.daysLeft)) : '';
      return spendRow(x.name, cls,
        '<span class="name">' + esc(x.name) + '<small>' + x.pct + '%・' + esc(x.cats.join('、')) + '</small></span>' +
        '<span class="fig num">' + money(x.used) + '<small> / ' + money(x.limit) + '</small></span>' +
        '<span class="track"><span class="fill" style="display:block;width:' + Math.min(ratio * 100, 100).toFixed(1) + '%"></span></span>' +
        '<span class="sub">' + (left < 0 ? '超支 <b>' + money(-left) + '</b>' : '剩 <b>' + money(left) + '</b>' + perDay) + '</span>', x.cats);
    });
    if (b.unassigned.used > 0) {
      // 帳目裡出現、但不在任何類別的分類（含已改名或刪除的舊分類）
      const owned = {};
      b.buckets.forEach(x => x.cats.forEach(cat => { owned[cat] = 1; }));
      const loose = [...new Set(state.records.map(r => r.category))].filter(cat => !owned[cat]);
      rows.push(spendRow('__unassigned__', ' over', '<span class="name">未分配<small>' + esc(loose.join('、')) + '</small></span>' +
        '<span class="fig num">' + money(b.unassigned.used) + '</span><span class="sub">這些分類沒有歸屬任何預算，按「調整」指定</span>', loose));
    }
    $('budget').innerHTML = rows.join('');
    const notes = [];
    const bm = +b.baseMonth.slice(5, 7);
    notes.push(b.noBase ? bm + ' 月沒有收入紀錄，本月只顯示已花金額；輸入 ' + bm + ' 月收入後就會出現額度'
      : '額度依 ' + bm + ' 月收入 ' + money(b.base) + ' 計算');
    if (state.holidayWarning) notes.push(state.holidayWarning);
    $('budgetNote').textContent = notes.join('。');
    $('budgetNote').className = 'note-line' + (state.holidayWarning || b.noBase ? ' warn' : '');
    $('budgetEditBtn').hidden = !c.isCurrent;
  }

  // ---------- 預算設定面板 ----------
  function openBudgetEditor() {
    const v = state.version;
    // from：原本的名稱，改名時後端用來把本月起的轉存紀錄一起改名
    const draft = { buckets: v.buckets.map(x => ({ name: x.name, from: x.name, type: x.type, pct: x.pct, cats: x.cats.slice() })) };
    const base = state.budget && !state.budget.noBase ? state.budget.base : 0;
    const estText = pct => base ? '本月約 ' + money(Math.round(base * (Number(pct) || 0) / 100)) : '';

    function owners() {
      const o = {};
      draft.buckets.forEach((x, i) => { if (x.type === '消費') x.cats.forEach(c => { o[c] = i; }); });
      return o;
    }
    function errors() {
      const errs = [];
      const names = {};
      draft.buckets.forEach((x, i) => {
        if (!x.name.trim()) errs.push('第 ' + (i + 1) + ' 個類別沒有名稱');
        else if (names[x.name.trim()]) errs.push('名稱「' + x.name + '」重複');
        names[x.name.trim()] = 1;
        if (!(x.pct >= 0 && x.pct <= 100)) errs.push('「' + x.name + '」百分比需在 0 到 100');
      });
      const total = draft.buckets.reduce((s, x) => s + (Number(x.pct) || 0), 0);
      if (Math.abs(total - 100) > 0.01) errs.push('合計需要剛好 100%');
      const o = owners();
      const miss = state.categories.filter(c => o[c] === undefined);
      if (miss.length) errs.push('還沒有歸屬：' + miss.join('、'));
      if (!draft.buckets.length) errs.push('至少要有一個預算類別');
      return { errs, total };
    }
    function draw() {
      const o = owners();
      const { errs, total } = errors();
      $('bRows').innerHTML = draft.buckets.map((x, i) => '<div class="bedit" data-i="' + i + '">' +
        '<div class="top">' +
        '<div class="field"><label>名稱</label><input data-k="name" value="' + esc(x.name) + '" maxlength="12"></div>' +
        '<div class="field"><label>百分比</label><input data-k="pct" type="number" inputmode="decimal" min="0" max="100" step="1" value="' + x.pct + '"></div>' +
        '<div class="field"><label>類型</label><select data-k="type"><option' + (x.type === '消費' ? ' selected' : '') + '>消費</option><option' + (x.type === '轉存' ? ' selected' : '') + '>轉存</option></select></div>' +
        '<button type="button" class="rm" data-rm="' + i + '" aria-label="刪除' + esc(x.name) + '">×</button></div>' +
        (x.type === '消費'
          ? '<div class="cats-pick">' + state.categories.map(c => {
            const mine = o[c] === i, taken = o[c] !== undefined && !mine;
            return '<button type="button" class="chip' + (taken ? ' taken' : '') + '" data-cat="' + esc(c) + '" aria-pressed="' + mine + '">' + esc(c) + '</button>';
          }).join('') + '</div>'
          : '<p class="note-line">轉存型：不算消費，另外記錄每次轉出的金額</p>') +
        '<p class="note-line est">' + estText(x.pct) + '</p>' +
        '</div>').join('');
      refresh();
    }
    // 只更新合計、錯誤訊息與每類估算金額，不重建輸入框（避免正在輸入的欄位被換掉）
    function refresh() {
      const { errs, total } = errors();
      const off = Math.abs(total - 100) > 0.01;
      $('bSum').innerHTML = '<span>合計</span><b class="num ' + (off ? 'bad' : 'ok') + '">' + Math.round(total * 100) / 100 + '%' +
        (off ? (total < 100 ? '，還差 ' + Math.round((100 - total) * 100) / 100 + '%' : '，超過 ' + Math.round((total - 100) * 100) / 100 + '%') : '') + '</b>';
      $('bErr').hidden = !errs.length;
      $('bErr').textContent = errs.join('；');
      $('bSave').disabled = !!errs.length;
      $('bRows').querySelectorAll('.bedit').forEach(box => {
        const x = draft.buckets[+box.dataset.i];
        const est = box.querySelector('.est');
        if (x && est) est.textContent = estText(x.pct);
      });
    }

    openSheet(
      '<h3 id="sheetTitle">預算設定</h3>' +
      '<p class="msg" style="margin:4px 0 14px">從本月（' + +(state.editableFrom || state.cycle.start).slice(5, 7) + ' 月 1 日起）生效，過去月份維持原本的設定。點分類可以移到別的類別。</p>' +
      '<div id="bRows"></div>' +
      '<button type="button" class="btn ghost" id="bAdd" style="margin-bottom:6px">＋ 新增預算類別</button>' +
      '<div class="sumline" id="bSum"></div>' +
      '<p class="msg err" id="bErr" hidden></p><p class="msg err" id="editErr" hidden></p>' +
      '<div class="actions"><button type="button" class="btn ghost" id="bCancel">取消</button><button type="button" class="btn" id="bSave">儲存</button></div>');

    $('bRows').oninput = e => {
      const box = e.target.closest('.bedit'); if (!box) return;
      const i = +box.dataset.i, k = e.target.dataset.k;
      if (k === 'name') { draft.buckets[i].name = e.target.value; refresh(); }
      if (k === 'pct') { draft.buckets[i].pct = e.target.value === '' ? NaN : Number(e.target.value); refresh(); }
    };
    // 只有「類型」改變需要重建（分類選擇區會出現或消失）
    $('bRows').onchange = e => {
      if (e.target.dataset.k !== 'type') return;
      const i = +e.target.closest('.bedit').dataset.i;
      draft.buckets[i].type = e.target.value;
      if (e.target.value === '轉存') draft.buckets[i].cats = [];
      draw();
    };
    $('bRows').onclick = e => {
      const rm = e.target.closest('[data-rm]');
      if (rm) { draft.buckets.splice(+rm.dataset.rm, 1); return draw(); }
      const chip = e.target.closest('[data-cat]');
      if (chip) {
        const i = +chip.closest('.bedit').dataset.i, cat = chip.dataset.cat;
        draft.buckets.forEach((x, j) => { if (j !== i) x.cats = x.cats.filter(c => c !== cat); });
        const mine = draft.buckets[i].cats;
        draft.buckets[i].cats = mine.indexOf(cat) >= 0 ? mine.filter(c => c !== cat) : mine.concat(cat);
        draw();
      }
    };
    $('bAdd').onclick = () => { draft.buckets.push({ name: '', type: '轉存', pct: 0, cats: [] }); draw(); };
    $('bCancel').onclick = closeSheet;
    $('bSave').onclick = async () => {
      const payload = { buckets: draft.buckets.map(x => ({ name: x.name.trim(), from: x.from || '', type: x.type, pct: Number(x.pct), cats: x.type === '消費' ? x.cats : [] })) };
      await mutate($('bSave'), '儲存中…', async () => {
        if (!isDemo()) await apiPost(Object.assign({ action: 'saveBudget' }, payload));
        else { demo.version = { start: state.cycle.start, buckets: payload.buckets }; }
        toast('預算已更新，本月起生效');
      });
    };
    draw();
  }

  // ---------- 收入 ----------
  const INCOME_ITEMS = ['薪資', '獎金', '其他'];
  function openIncome(editId) {
    const c = state.cycle;
    const list = state.incomes.slice().sort((a, b2) => a.date.localeCompare(b2.date));
    const editing = editId ? list.find(x => x.id === editId) : null;
    const s0 = state.schedule || {};
    const defItem = editing ? editing.item : (s0.bonus && s0.bonus.daysLeft === 0 ? '獎金' : '薪資');
    const defDate = editing ? editing.date : (c.isCurrent ? state.today : c.end);
    const itemOpts = INCOME_ITEMS.concat(editing && INCOME_ITEMS.indexOf(editing.item) < 0 ? [editing.item] : [])
      .map(x => '<option' + (x === defItem ? ' selected' : '') + '>' + esc(x) + '</option>').join('');
    openSheet(
      '<h3 id="sheetTitle">' + +c.start.slice(5, 7) + ' 月收入</h3>' +
      '<p class="msg" style="margin:4px 0 8px">合計 ' + money(sum(list)) + '，會成為 ' + (+c.nextStart.slice(5, 7)) + ' 月的預算額度</p>' +
      '<div class="tlist">' + (list.length ? list.map(x => '<div class="trow"><span class="num">' + md(x.date) + '　' + esc(x.item) + '　' + money(x.amount) +
        (x.note ? '　<span style="color:var(--text-3)">' + esc(x.note) + '</span>' : '') + '</span>' +
        '<button type="button" data-edit-i="' + esc(x.id) + '" style="color:var(--accent)">修改</button></div>').join('')
        : '<p class="note-line">這個月還沒有收入紀錄</p>') + '</div>' +
      '<form id="iForm">' +
      '<p class="msg" style="margin:0 0 8px;font-weight:600">' + (editing ? '修改這筆收入' : '新增收入') + '</p>' +
      '<div class="row2"><div class="field"><label for="iItem">項目</label><select id="iItem">' + itemOpts + '</select></div>' +
      '<div class="field"><label for="iAmt">金額（元）</label><input id="iAmt" type="number" inputmode="numeric" min="1" step="1" value="' + (editing ? editing.amount : '') + '" required></div></div>' +
      '<div class="field"><label for="iDate">入帳日</label><input id="iDate" type="date" value="' + defDate + '" required></div>' +
      '<div class="field"><label for="iNote">備註</label><input id="iNote" value="' + esc(editing ? editing.note : '') + '" placeholder="例如：含加班費"></div>' +
      '<p class="msg err" id="editErr" hidden></p>' +
      '<div class="actions">' + (editing ? '<button type="button" class="btn danger" id="iDel">刪除</button>' : '<button type="button" class="btn ghost" id="iCancel">關閉</button>') +
      '<button class="btn" id="iSave">' + (editing ? '儲存修改' : '新增') + '</button></div></form>');

    $('sheet').querySelectorAll('[data-edit-i]').forEach(b2 => { b2.onclick = () => openIncome(b2.dataset.editI); });
    if ($('iCancel')) $('iCancel').onclick = closeSheet;
    $('iForm').onsubmit = async e => {
      e.preventDefault();
      const f = { item: $('iItem').value, amount: Number($('iAmt').value), date: $('iDate').value, note: $('iNote').value.trim() };
      if (!Number.isInteger(f.amount) || f.amount <= 0) return showErr('金額需為正整數');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(f.date)) return showErr('請選入帳日');
      await mutate($('iSave'), '儲存中…', async () => {
        if (!isDemo()) await apiPost(Object.assign({ action: editing ? 'updateIncome' : 'addIncome', id: editing ? editing.id : undefined }, f));
        else if (editing) Object.assign(demo.incomes.find(x => x.id === editing.id), f);
        else demo.incomes.push(Object.assign({ id: 'demo-i' + Date.now(), source: '網頁' }, f));
        toast(editing ? '已修改' : '已新增收入');
      });
    };
    if ($('iDel')) $('iDel').onclick = async () => {
      if (!confirmTwice($('iDel'))) return;
      await mutate($('iDel'), '刪除中…', async () => {
        if (!isDemo()) await apiPost({ action: 'deleteIncome', id: editing.id });
        else demo.incomes = demo.incomes.filter(x => x.id !== editing.id);
        toast('已刪除');
      });
    };
  }

  // ---------- 轉存（投資等） ----------
  function openTransfer(bucket) {
    const list = state.transfers.filter(t => t.bucket === bucket);
    const target = (state.budget.buckets.find(x => x.name === bucket) || {}).limit || 0;
    openSheet(
      '<h3 id="sheetTitle">' + esc(bucket) + '</h3>' +
      '<p class="msg" style="margin:4px 0 8px">' + (target ? '本月目標 ' + money(target) + '，' : '') + '已轉 ' + money(sum(list)) + '</p>' +
      '<div class="tlist">' + (list.length ? list.map(t => '<div class="trow"><span class="num">' + md(t.date) + '　' + money(t.amount) +
        (t.note ? '　<span style="color:var(--text-3)">' + esc(t.note) + '</span>' : '') + '</span>' +
        (state.cycle.isCurrent ? '<button type="button" data-del-t="' + esc(t.id) + '">刪除</button>' : '') + '</div>').join('')
        : '<p class="note-line">本月還沒有紀錄</p>') + '</div>' +
      (state.cycle.isCurrent
        ? '<form id="tForm"><div class="row2">' +
          '<div class="field"><label for="tDate">日期</label><input id="tDate" type="date" value="' + state.today + '" max="' + state.today + '" min="' + state.cycle.start + '" required></div>' +
          '<div class="field"><label for="tAmt">金額（元）</label><input id="tAmt" type="number" inputmode="numeric" min="1" step="1" required></div></div>' +
          '<div class="field"><label for="tNote">備註</label><input id="tNote" placeholder="例如：0050 定期定額"></div>' +
          '<p class="msg err" id="editErr" hidden></p>' +
          '<button class="btn" id="tSave">記一筆轉存</button></form>'
        : '<p class="note-line">過去月份只能查看</p>'));
    const form = $('tForm');
    if (form) form.onsubmit = async e => {
      e.preventDefault();
      const amount = Number($('tAmt').value);
      if (!Number.isInteger(amount) || amount <= 0) return showErr('金額需為正整數');
      const item = { date: $('tDate').value, bucket, amount, note: $('tNote').value.trim() };
      await mutate($('tSave'), '儲存中…', async () => {
        if (!isDemo()) await apiPost(Object.assign({ action: 'addTransfer' }, item));
        else demo.transfers.push(Object.assign({ id: 'demo-t' + Date.now() }, item));
        toast('已記錄');
      });
    };
    $('sheet').querySelectorAll('[data-del-t]').forEach(btn => {
      btn.onclick = async () => {
        if (!confirmTwice(btn)) return;
        const id = btn.dataset.delT;
        try {
          if (!isDemo()) await apiPost({ action: 'deleteTransfer', id });
          else demo.transfers = demo.transfers.filter(t => t.id !== id);
          closeSheet(); toast('已刪除'); load();
        } catch (err) { toast('刪除失敗：' + err.message); }
      };
    });
  }

  function recRow(r) {
    const cls = r.status === '待補金額' ? 'need' : r.status === '待確認' ? 'check' : '';
    const badge = cls ? '<span class="badge">' + esc(r.status) + '</span>' : '<span class="meta">' + esc(r.payment) + '</span>';
    return '<button class="rec ' + cls + '" data-id="' + esc(r.id) + '">' +
      '<span class="item">' + esc(r.item) + '</span>' +
      '<span class="amt num">' + (r.amount == null ? '未填' : money(r.amount)) + '</span>' +
      '<span class="meta">' + esc(r.category) + ' · ' + esc(r.date.slice(5).replace('-', '/')) + '</span>' + badge + '</button>';
  }

  function renderList() {
    const statuses = ['全部', '待處理', '已完成'];
    $('statusFilters').innerHTML = statuses.map(s =>
      '<button class="chip" data-fs="' + s + '" aria-pressed="' + (state.filterStatus === s) + '">' + s +
      (s === '待處理' && state.pending.length ? ' ' + state.pending.length : '') + '</button>').join('');
    $('catFilters').innerHTML = ['全部'].concat(state.categories).map(c =>
      '<button class="chip" data-fc="' + esc(c) + '" aria-pressed="' + (state.filterCat === c) + '">' + esc(c) + '</button>').join('');

    // 「待處理」跨月份顯示，其他篩選只看本月
    let list = state.filterStatus === '待處理' ? state.pending.slice() : state.records.slice();
    if (state.filterStatus === '已完成') list = list.filter(r => r.status === '已完成');
    if (state.filterCat !== '全部') list = list.filter(r => r.category === state.filterCat);
    list.sort((a, b) => b.date.localeCompare(a.date) || (b.created || '').localeCompare(a.created || ''));

    if (!list.length) {
      $('fullList').innerHTML = '<div class="empty"><b>沒有符合的紀錄</b>換個篩選條件看看</div>';
      return;
    }
    let html = '<div class="list">', cur = '';
    list.forEach(r => {
      if (r.date !== cur) {
        cur = r.date;
        const dayTotal = sum(list.filter(x => x.date === cur));
        html += '<div class="day-head num"><span>' + cur.slice(5).replace('-', '/') + '（' + weekday(cur) + '）</span><span>' + money(dayTotal) + '</span></div>';
      }
      html += recRow(r);
    });
    $('fullList').innerHTML = html + '</div>';
  }

  // ---------- 編輯面板 ----------
  function findRec(id) {
    return state.records.find(r => r.id === id) || state.pending.find(r => r.id === id);
  }

  function openSheet(html) {
    $('sheet').innerHTML = '<div class="grip"></div>' + html;
    $('sheet').classList.add('open');
    $('sheetBg').classList.add('open');
  }
  function closeSheet() {
    $('sheet').classList.remove('open');
    $('sheetBg').classList.remove('open');
  }

  function openEdit(id) {
    const r = findRec(id);
    if (!r) return;
    const opts = (list, v) => list.map(x => '<option' + (x === v ? ' selected' : '') + '>' + esc(x) + '</option>').join('');
    openSheet(
      '<h3 id="sheetTitle">編輯紀錄</h3>' +
      '<div class="raw">原始輸入：<b>' + esc(r.raw) + '</b>' + (r.doubt ? '<br>疑點：' + esc(r.doubt) : '') + '</div>' +
      '<form id="editForm">' +
      '<div class="row2"><div class="field"><label for="eDate">日期</label><input id="eDate" type="date" value="' + esc(r.date) + '" required></div>' +
      '<div class="field"><label for="eAmt">金額（元）</label><input id="eAmt" type="number" inputmode="numeric" min="1" step="1" value="' + (r.amount == null ? '' : r.amount) + '" placeholder="未填"></div></div>' +
      '<div class="field"><label for="eItem">品項</label><input id="eItem" value="' + esc(r.item) + '" required></div>' +
      '<div class="row2"><div class="field"><label for="eCat">分類</label><select id="eCat">' + opts(state.categories, r.category) + '</select></div>' +
      '<div class="field"><label for="ePay">付款方式</label><select id="ePay">' + opts(state.payments, r.payment) + '</select></div></div>' +
      '<p class="msg err" id="editErr" hidden></p>' +
      '<div class="actions"><button type="button" class="btn danger" id="delBtn">刪除</button><button class="btn" id="saveBtn">儲存</button></div>' +
      '</form>');

    $('editForm').onsubmit = async e => {
      e.preventDefault();
      const amtRaw = $('eAmt').value.trim();
      const fields = { date: $('eDate').value, amount: amtRaw === '' ? null : Number(amtRaw),
        item: $('eItem').value.trim(), category: $('eCat').value, payment: $('ePay').value };
      if (fields.amount !== null && (!Number.isInteger(fields.amount) || fields.amount <= 0)) {
        return showErr('金額需為正整數');
      }
      await mutate($('saveBtn'), '儲存中…', async () => {
        if (!isDemo()) await apiPost({ action: 'update', id: r.id, fields });
        else Object.assign(r, fields, { status: fields.amount == null ? '待補金額' : '已完成', doubt: '' });
        toast('已儲存');
      });
    };
    $('delBtn').onclick = async () => {
      if (!confirmTwice($('delBtn'))) return;
      await mutate($('delBtn'), '刪除中…', async () => {
        if (!isDemo()) await apiPost({ action: 'delete', id: r.id });
        else demo.records = (demo.records || []).filter(x => x !== r);
        toast('已刪除');
      });
    };
  }

  function showErr(msg) { const el = $('editErr'); el.textContent = msg; el.hidden = false; }

  async function mutate(btn, label, fn) {
    const old = btn.textContent;
    btn.disabled = true; btn.textContent = label;
    try {
      await fn();
      closeSheet();
      await load();
    } catch (e) {
      showErr(e.message);
      btn.disabled = false; btn.textContent = old;
    }
  }

  // ---------- 資產 ----------
  const ASSET_TYPES = ['銀行', '現金', '信用卡'];
  const signed = n => (n < 0 ? '-' : '') + money(Math.abs(n));
  const demoAssets = { snaps: null };

  function summarize(s) {
    const assets = s.items.filter(x => x.type !== '信用卡').reduce((a, x) => a + x.amount, 0);
    const debt = s.items.filter(x => x.type === '信用卡').reduce((a, x) => a + x.amount, 0);
    return { date: s.date, items: s.items, assets, debt, net: assets - debt };
  }
  function demoAssetData() {
    const today = twToday();
    if (!demoAssets.snaps) {
      const base = [['台新銀行', '銀行', 82000], ['郵局', '銀行', 20000], ['錢包', '現金', 2500], ['信用卡', '信用卡', 9800]];
      demoAssets.snaps = [];
      for (let k = 5; k >= 1; k--) {
        const d = addDays(state.cycle ? state.cycle.start : today, -31 * k);
        demoAssets.snaps.push({ date: d, items: base.map((b, i) => ({ name: b[0], type: b[1],
          amount: Math.max(0, b[2] + (5 - k) * [4200, 600, -150, 900][i] + (k % 2 ? 1300 : -800) * (i === 0 ? 1 : 0)), note: '' })) });
      }
    }
    const snaps = demoAssets.snaps.slice().sort((a, b) => a.date.localeCompare(b.date)).map(summarize);
    const latest = snaps[snaps.length - 1] || null;
    const cycleStart = state.cycle ? state.editableFrom || state.cycle.start : today;
    return { today, snapshots: snaps, latest, prev: snaps[snaps.length - 2] || null,
      since: latest ? { income: 40000, expense: 2130, cardExpense: 1500, transfer: 5000, days: daysBetween(latest.date, today) } : null,
      remind: !latest || latest.date < cycleStart, cycleStart, types: ASSET_TYPES };
  }

  async function loadAssets() {
    try {
      state.assets = isDemo() ? demoAssetData() : await apiGet({ action: 'assets' });
      if (!state.assets || !('snapshots' in state.assets)) { state.assets = null; throw new Error('後端還是舊版程式，請重新部署並選「新版本」'); }
    } catch (e) {
      toast('讀取資產失敗：' + e.message);
      return;
    }
    renderAssets();
  }

  function renderAssets() {
    const a = state.assets;
    if (!a) return;
    const L = a.latest, P = a.prev;
    if (!L) {
      $('netWorth').textContent = '-';
      $('netCmp').textContent = '';
      $('netWhen').textContent = '還沒有盤點紀錄';
      $('acctList').innerHTML = '<div class="empty"><b>先盤點一次</b>按右上「盤點」輸入各帳戶目前的實際餘額</div>';
    } else {
      $('netWorth').textContent = signed(L.net);
      if (P) {
        const d = L.net - P.net;
        $('netCmp').innerHTML = '比上次盤點 ' + (d === 0 ? '<b>無變化</b>' : '<b class="' + (d > 0 ? 'down' : 'up') + '">' + (d > 0 ? '增加 ' : '減少 ') + money(Math.abs(d)) + '</b>') + '（' + md(P.date) + ' → ' + md(L.date) + '）';
      } else {
        $('netCmp').textContent = '第一次盤點';
      }
      $('netWhen').textContent = '資產 ' + money(L.assets) + '－信用卡 ' + money(L.debt) + '｜' + L.date + ' 盤點';
      const prevOf = name => P && P.items.find(x => x.name === name);
      const row = x => {
        const p0 = prevOf(x.name);
        const diff = p0 ? x.amount - p0.amount : null;
        const shownDiff = diff === null ? '新帳戶' : diff === 0 ? '無變化' : (x.type === '信用卡' ? (diff > 0 ? '欠款增加 ' : '欠款減少 ') : (diff > 0 ? '+' : '-')) + money(Math.abs(diff));
        return '<div class="acct' + (x.type === '信用卡' ? ' debt' : '') + '"><span class="nm">' + esc(x.name) + '</span>' +
          '<span class="am num">' + (x.type === '信用卡' ? '-' : '') + money(x.amount) + '</span>' +
          '<span class="tp">' + esc(x.type) + (x.note ? '・' + esc(x.note) : '') + '</span><span class="df num">' + shownDiff + '</span></div>';
      };
      const order = t => ASSET_TYPES.indexOf(t);
      const items = L.items.slice().sort((x, y) => order(x.type) - order(y.type) || y.amount - x.amount);
      $('acctList').innerHTML = items.map(row).join('') +
        '<div class="acct total"><span class="nm">淨資產</span><span class="am num">' + signed(L.net) + '</span></div>';
    }

    // 提醒
    $('assetRemind').hidden = !a.remind;
    $('assetRemindText').textContent = L ? '這個月還沒盤點，點這裡更新餘額' : '還沒有任何盤點，點這裡開始';

    // 盤點後的記帳流量（參考）
    if (L && a.since && a.since.days > 0) {
      $('sinceNote').hidden = false;
      const card = a.since.cardExpense || 0;
      $('sinceNote').innerHTML = '上次盤點後 ' + a.since.days + ' 天，記帳記錄了：收入 ' + money(a.since.income) + '、支出 ' + money(a.since.expense) +
        (card ? '、刷卡 ' + money(card) : '') + '、轉存 ' + money(a.since.transfer) +
        '<br><span style="color:var(--text-3)">' + (card ? '刷卡的錢還沒從銀行扣，會變成信用卡欠款。' : '') + '只是參考，淨資產以盤點的實際餘額為準</span>';
    } else {
      $('sinceNote').hidden = true;
    }

    // 趨勢
    const pts = a.snapshots;
    if (pts.length < 2) {
      $('trendSvg').innerHTML = '';
      $('trendSvg').style.height = '0px';
      $('trendAxis').innerHTML = '<span>盤點兩次以上就會出現趨勢線</span>';
    } else {
      $('trendSvg').style.height = '';
      const W = 300, H = 120, pad2 = 8;
      const t0 = Date.parse(pts[0].date), t1 = Date.parse(pts[pts.length - 1].date);
      const vals = pts.map(x => x.net), lo = Math.min(...vals), hi = Math.max(...vals);
      const span = hi - lo || Math.abs(hi) || 1;
      const X = d => pad2 + (Date.parse(d) - t0) / (t1 - t0 || 1) * (W - 2 * pad2);
      const Y = v => pad2 + (1 - (v - lo + span * .1) / (span * 1.2)) * (H - 2 * pad2);
      const path = pts.map((x, i) => (i ? 'L' : 'M') + X(x.date).toFixed(1) + ' ' + Y(x.net).toFixed(1)).join('');
      $('trendSvg').setAttribute('viewBox', '0 0 ' + W + ' ' + H);
      $('trendSvg').setAttribute('preserveAspectRatio', 'none');
      $('trendSvg').innerHTML = '<path d="' + path + '" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>' +
        pts.map(x => '<circle cx="' + X(x.date).toFixed(1) + '" cy="' + Y(x.net).toFixed(1) + '" r="3" fill="var(--accent)" vector-effect="non-scaling-stroke"><title>' + x.date + ' ' + signed(x.net) + '</title></circle>').join('');
      $('trendAxis').innerHTML = '<span>' + md(pts[0].date) + '　' + signed(pts[0].net) + '</span><span>' + md(pts[pts.length - 1].date) + '　' + signed(pts[pts.length - 1].net) + '</span>';
    }

    // 盤點紀錄
    $('snapList').innerHTML = pts.length
      ? pts.slice().reverse().map(x => '<button class="snap-row" data-snap="' + x.date + '"><span class="num">' + x.date + '（' + weekday(x.date) + '）</span><span class="num">' + signed(x.net) + '</span></button>').join('')
      : '<div class="empty">沒有紀錄</div>';
  }

  function openSnapshot(date) {
    const a = state.assets || {};
    const existing = date && (a.snapshots || []).find(x => x.date === date);
    const src = existing || a.latest;
    const draft = {
      date: existing ? existing.date : state.today,
      items: src ? src.items.map(x => ({ name: x.name, type: x.type, amount: existing ? x.amount : x.amount, note: x.note || '' }))
        : [{ name: '銀行', type: '銀行', amount: 0, note: '' }, { name: '錢包', type: '現金', amount: 0, note: '' }, { name: '信用卡', type: '信用卡', amount: 0, note: '' }],
    };
    function totals() {
      const assets = draft.items.filter(x => x.type !== '信用卡').reduce((s, x) => s + (Number(x.amount) || 0), 0);
      const debt = draft.items.filter(x => x.type === '信用卡').reduce((s, x) => s + (Number(x.amount) || 0), 0);
      return { assets, debt, net: assets - debt };
    }
    function errs() {
      const e = [], names = {};
      if (!draft.items.length) e.push('至少要有一個帳戶');
      draft.items.forEach((x, i) => {
        const n = x.name.trim();
        if (!n) e.push('第 ' + (i + 1) + ' 個帳戶沒有名稱'); else if (names[n]) e.push('「' + n + '」重複');
        names[n] = 1;
        if (!(Number.isInteger(Number(x.amount)) && Number(x.amount) >= 0)) e.push('「' + (n || '帳戶') + '」金額需為 0 以上的整數');
      });
      if (draft.date > state.today) e.push('盤點日不可晚於今天');
      return e;
    }
    function refresh() {
      const t = totals(), e = errs();
      $('sTotal').innerHTML = '<span>淨資產</span><b class="num">' + signed(t.net) + '</b>';
      $('sErr').hidden = !e.length; $('sErr').textContent = e.join('；'); $('sSave').disabled = !!e.length;
    }
    function draw() {
      $('sRows').innerHTML = draft.items.map((x, i) => '<div class="sedit" data-i="' + i + '">' +
        '<div class="field"><label>帳戶</label><input data-k="name" value="' + esc(x.name) + '" maxlength="20"></div>' +
        '<div class="field"><label>類型</label><select data-k="type">' + ASSET_TYPES.map(t => '<option' + (t === x.type ? ' selected' : '') + '>' + t + '</option>').join('') + '</select></div>' +
        '<div class="field"><label>' + (x.type === '信用卡' ? '未繳金額' : '餘額') + '</label><input data-k="amount" type="number" inputmode="numeric" min="0" step="1" value="' + x.amount + '"></div>' +
        '<button type="button" class="rm" data-rm="' + i + '" aria-label="刪除' + esc(x.name) + '">×</button></div>').join('');
      refresh();
    }
    openSheet(
      '<h3 id="sheetTitle">' + (existing ? '修改盤點' : '盤點資產') + '</h3>' +
      '<p class="msg" style="margin:4px 0 14px">輸入銀行 App、錢包裡的實際金額；信用卡填目前未繳的金額（正數）。' + (existing ? '' : '已帶入上次的數字，改有變動的就好。') + '</p>' +
      '<div class="field"><label for="sDate">盤點日</label><input id="sDate" type="date" value="' + draft.date + '" max="' + state.today + '"' + (existing ? ' disabled' : '') + '></div>' +
      '<div id="sRows"></div>' +
      '<button type="button" class="btn ghost" id="sAdd" style="margin-bottom:6px">＋ 新增帳戶</button>' +
      '<div class="sumline" id="sTotal"></div>' +
      '<p class="msg err" id="sErr" hidden></p><p class="msg err" id="editErr" hidden></p>' +
      '<div class="actions">' + (existing ? '<button type="button" class="btn danger" id="sDel">刪除</button>' : '<button type="button" class="btn ghost" id="sCancel">取消</button>') +
      '<button type="button" class="btn" id="sSave">儲存</button></div>');

    $('sDate').oninput = e => { draft.date = e.target.value; refresh(); };
    $('sRows').oninput = e => {
      const box = e.target.closest('.sedit'); if (!box) return;
      const x = draft.items[+box.dataset.i], k = e.target.dataset.k;
      if (k === 'name') x.name = e.target.value;
      if (k === 'amount') x.amount = e.target.value === '' ? NaN : Number(e.target.value);
      refresh();
    };
    $('sRows').onchange = e => {
      if (e.target.dataset.k !== 'type') return;
      draft.items[+e.target.closest('.sedit').dataset.i].type = e.target.value;
      draw();
    };
    $('sRows').onclick = e => {
      const rm = e.target.closest('[data-rm]');
      if (rm) { draft.items.splice(+rm.dataset.rm, 1); draw(); }
    };
    $('sAdd').onclick = () => { draft.items.push({ name: '', type: '銀行', amount: 0, note: '' }); draw(); };
    if ($('sCancel')) $('sCancel').onclick = closeSheet;
    $('sSave').onclick = async () => {
      const items = draft.items.map(x => ({ name: x.name.trim(), type: x.type, amount: Number(x.amount), note: x.note }));
      await mutateAssets($('sSave'), '儲存中…', async () => {
        if (!isDemo()) await apiPost({ action: 'saveSnapshot', date: draft.date, items });
        else {
          demoAssets.snaps = demoAssets.snaps.filter(x => x.date !== draft.date);
          demoAssets.snaps.push({ date: draft.date, items });
        }
        toast('已儲存盤點');
      });
    };
    if ($('sDel')) $('sDel').onclick = async () => {
      if (!confirmTwice($('sDel'))) return;
      await mutateAssets($('sDel'), '刪除中…', async () => {
        if (!isDemo()) await apiPost({ action: 'deleteSnapshot', date: draft.date });
        else demoAssets.snaps = demoAssets.snaps.filter(x => x.date !== draft.date);
        toast('已刪除');
      });
    };
    draw();
  }

  async function mutateAssets(btn, label, fn) {
    const old = btn.textContent;
    btn.disabled = true; btn.textContent = label;
    try {
      await fn();
      closeSheet();
      await loadAssets();
    } catch (e) {
      showErr(e.message);
      btn.disabled = false; btn.textContent = old;
    }
  }

  // ---------- 記一筆 ----------
  const EXAMPLES = ['晚餐雞腿飯一百二', '早餐蛋餅35 咖啡60', '昨天加油五百', '剛剛那筆改成150'];
  $('examples').innerHTML = EXAMPLES.map(t => '<button type="button" class="chip">' + esc(t) + '</button>').join('');
  $('examples').onclick = e => {
    if (e.target.matches('.chip')) { $('addText').value = e.target.textContent; $('addText').focus(); }
  };

  // 入帳結果卡片，每張都有「復原」：新增的就刪掉，修改的就改回原本內容
  let lastResult = null;
  function showAddResult(data) {
    lastResult = data;
    const amend = data.action === 'amend_last';
    const head = amend ? '已修改上一筆' : '已入帳 ' + data.records.length + ' 筆';
    $('addResult').innerHTML = '<p class="msg">' + head + '</p>' + data.records.map((r, i) =>
      '<div class="card' + (r.status !== '已完成' ? ' warn' : '') + '" id="res' + i + '">' +
      '<div class="title"><span>' + esc(r.item) + '</span><span class="num">' + (r.amount == null ? '缺金額' : money(r.amount)) + '</span></div>' +
      '<div class="sub">' + esc(r.category) + ' · ' + esc(r.date) + ' · ' + esc(r.payment) + '</div>' +
      (r.status !== '已完成' ? '<div class="note">' + esc(r.status) + (r.doubt ? '：' + esc(r.doubt) : '') + '</div>' : '') +
      (r.id ? '<button type="button" class="undo" data-undo="' + i + '">' + (amend ? '復原修改' : '復原（刪除這筆）') + '</button>' : '') +
      '</div>').join('');
  }

  $('addResult').onclick = async e => {
    const btn = e.target.closest('[data-undo]');
    if (!btn || !lastResult) return;
    const i = +btn.dataset.undo, r = lastResult.records[i];
    btn.disabled = true; btn.textContent = '復原中…';
    try {
      if (lastResult.action === 'amend_last') {
        const b4 = lastResult.before;
        if (!isDemo()) await apiPost({ action: 'update', id: r.id, fields: b4 });
        else Object.assign(demo.records.find(x => x.id === r.id) || {}, b4);
      } else {
        if (!isDemo()) await apiPost({ action: 'delete', id: r.id });
        else demo.records = (demo.records || []).filter(x => x.id !== r.id);
      }
      $('res' + i).classList.add('undone');
      btn.textContent = '已復原';
      toast('已復原');
      load();
    } catch (err) {
      btn.disabled = false; btn.textContent = '復原失敗，再試一次';
      toast('復原失敗：' + err.message);
    }
  };

  $('addForm').onsubmit = async e => {
    e.preventDefault();
    const text = $('addText').value.trim();
    if (!text) return;
    if (isDemo()) {
      $('addResult').innerHTML = '<p class="msg err">示範模式無法用 AI 解析，可以先試「不用 AI，手動輸入」，或到設定填入 Apps Script 網址與 Token。</p>';
      return;
    }
    const btn = $('addBtn');
    btn.disabled = true; btn.textContent = '解析中…';
    $('addResult').innerHTML = '<div class="card"><div class="skel" style="height:18px;width:60%"></div><div class="skel" style="height:14px;width:40%;margin-top:8px"></div></div>';
    try {
      const data = await apiPost({ action: 'add', text });
      if (data.action === 'ignore') {
        $('addResult').innerHTML = '<p class="msg">沒有入帳：' + esc(data.reason) + '</p>' +
          '<button type="button" class="btn ghost" id="toManual" style="margin-top:8px">其實是消費，改用手動輸入</button>';
        $('toManual').onclick = () => openManual(text);
      } else {
        showAddResult(data);
        $('addText').value = '';
        load();
      }
    } catch (err) {
      // AI 失敗（額度用完、Google 端滿載）時，直接提供手動輸入，原本的文字帶進品項
      $('addResult').innerHTML = '<p class="msg err">AI 解析失敗：' + esc(err.message) + '</p>' +
        '<button type="button" class="btn" id="toManual" style="margin-top:8px">改用手動輸入</button>';
      $('toManual').onclick = () => openManual(text);
    }
    btn.disabled = false; btn.textContent = '送出';
  };

  $('manualBtn').onclick = () => openManual('');

  // ---------- 手動記一筆（不經過 AI） ----------
  function openManual(prefill) {
    const cats = state.categories;
    const pays = state.payments;
    let cat = cats.indexOf('餐飲') >= 0 ? '餐飲' : cats[0];
    // 口語文字裡的阿拉伯數字當作金額，剩下的當品項
    const m = String(prefill || '').match(/\d+/);
    const preAmt = m ? m[0] : '';
    const preItem = String(prefill || '').replace(/\d+\s*(元|塊)?/, '').trim();
    openSheet(
      '<h3 id="sheetTitle">手動記一筆</h3>' +
      '<form id="mForm" style="margin-top:12px">' +
      '<div class="row2"><div class="field"><label for="mAmt">金額（元）</label><input id="mAmt" type="number" inputmode="numeric" min="1" step="1" value="' + esc(preAmt) + '" required></div>' +
      '<div class="field"><label for="mDate">日期</label><input id="mDate" type="date" value="' + state.today + '" max="' + state.today + '" required></div></div>' +
      '<div class="field"><label for="mItem">品項</label><input id="mItem" value="' + esc(preItem) + '" placeholder="例如：雞腿飯" maxlength="50" required></div>' +
      '<div class="field"><label>分類</label><div class="pick" id="mCats">' + cats.map(c =>
        '<button type="button" class="chip" data-mcat="' + esc(c) + '" aria-pressed="' + (c === cat) + '">' + esc(c) + '</button>').join('') + '</div></div>' +
      '<div class="field"><label for="mPay">付款方式</label><select id="mPay">' + pays.map(p => '<option>' + esc(p) + '</option>').join('') + '</select></div>' +
      '<p class="msg err" id="editErr" hidden></p>' +
      '<div class="actions"><button type="button" class="btn ghost" id="mCancel">取消</button><button class="btn" id="mSave">記下來</button></div>' +
      '</form>');
    $('mCats').onclick = e => {
      const b2 = e.target.closest('[data-mcat]'); if (!b2) return;
      cat = b2.dataset.mcat;
      $('mCats').querySelectorAll('[data-mcat]').forEach(x => x.setAttribute('aria-pressed', String(x === b2)));
    };
    $('mCancel').onclick = closeSheet;
    setTimeout(() => $(preAmt ? 'mItem' : 'mAmt').focus(), 300);
    $('mForm').onsubmit = async e => {
      e.preventDefault();
      const fields = { amount: Number($('mAmt').value), date: $('mDate').value, item: $('mItem').value.trim(), category: cat, payment: $('mPay').value };
      if (!Number.isInteger(fields.amount) || fields.amount <= 0) return showErr('金額需為正整數');
      if (!fields.item) return showErr('請填品項');
      if (fields.date > state.today) return showErr('日期不可晚於今天');
      await mutate($('mSave'), '儲存中…', async () => {
        let data;
        if (!isDemo()) data = await apiPost({ action: 'addManual', fields });
        else {
          const rec = Object.assign({ id: 'demo-m' + Date.now(), created: state.today + ' 12:00:00', status: '已完成', confidence: '高', doubt: '', raw: '手動：' + fields.item, source: '網頁手動' }, fields);
          if (demo.records) demo.records.push(rec);
          data = { action: 'add', records: [rec] };
        }
        $('addText').value = '';
        showAddResult(data);
        toast('已記下');
      });
    };
  }

  // ---------- 設定 ----------
  function openSettings() {
    const c = cfg();
    openSheet(
      '<h3 id="sheetTitle">連線設定</h3>' +
      '<p class="msg" style="margin:4px 0 16px">只存在這台裝置的瀏覽器，不會上傳到 GitHub。</p>' +
      '<form id="setForm">' +
      '<div class="field"><label for="sUrl">Apps Script 網址</label><input id="sUrl" type="url" value="' + esc(c.url) + '" placeholder="https://script.google.com/macros/s/…/exec"></div>' +
      '<div class="field"><label for="sRead">讀取 Token</label><input id="sRead" value="' + esc(c.read) + '" autocomplete="off"></div>' +
      '<div class="field"><label for="sWrite">寫入 Token</label><input id="sWrite" value="' + esc(c.write) + '" autocomplete="off"><span class="help">只想看帳可以留空，就無法記帳與編輯。</span></div>' +
      '<p class="msg err" id="editErr" hidden></p>' +
      '<div class="actions"><button type="button" class="btn ghost" id="clearBtn">清除</button><button class="btn" id="testBtn">測試並儲存</button></div>' +
      '</form>');

    $('setForm').onsubmit = async e => {
      e.preventDefault();
      const url = $('sUrl').value.trim(), read = $('sRead').value.trim(), write = $('sWrite').value.trim();
      if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)) return showErr('網址格式應為 https://script.google.com/macros/s/…/exec');
      if (!read) return showErr('請填讀取 Token');
      const btn = $('testBtn');
      btn.disabled = true; btn.textContent = '連線中…';
      const old = cfg();
      store.set('url', url); store.set('read', read); store.set('write', write);
      try {
        await apiGet({ action: 'ping' });
        closeSheet();
        toast('連線成功');
        state.assets = null;
        load();
      } catch (err) {
        store.set('url', old.url); store.set('read', old.read); store.set('write', old.write);
        showErr('連線失敗：' + err.message);
        btn.disabled = false; btn.textContent = '測試並儲存';
      }
    };
    $('clearBtn').onclick = () => {
      ['url', 'read', 'write'].forEach(k => store.set(k, ''));
      closeSheet();
      toast('已清除，改為示範資料');
      state.assets = null;
      load();
    };
  }

  // ---------- 事件 ----------
  function setView(v) {
    state.view = v;
    ['overview', 'list', 'assets', 'add'].forEach(x => { $('view-' + x).hidden = x !== v; });
    if (v === 'assets' && !state.assets) loadAssets();
    document.querySelector('.month').style.visibility = v === 'assets' ? 'hidden' : '';
    document.querySelectorAll('nav.tabs button').forEach(b => {
      if (b.dataset.view === v) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    window.scrollTo(0, 0);
  }

  document.querySelector('nav.tabs').onclick = e => {
    const b = e.target.closest('button');
    if (b) setView(b.dataset.view);
  };
  document.body.addEventListener('click', e => {
    const rec = e.target.closest('.rec');
    if (rec) return openEdit(rec.dataset.id);
    const sn = e.target.closest('[data-snap]');
    if (sn) return openSnapshot(sn.dataset.snap);
    const tr = e.target.closest('[data-transfer]');
    if (tr) return openTransfer(tr.dataset.transfer);
    const bk = e.target.closest('[data-bucket]');
    if (bk) {
      const k = bk.dataset.bucket;
      if (state.expanded.has(k)) state.expanded.delete(k); else state.expanded.add(k);
      return renderBudget();
    }
    const fs = e.target.closest('[data-fs]');
    if (fs) { state.filterStatus = fs.dataset.fs; return renderList(); }
    const fc = e.target.closest('[data-fc]');
    if (fc) { state.filterCat = fc.dataset.fc; return renderList(); }
  });
  $('pendingBanner').onclick = () => { state.filterStatus = '待處理'; state.filterCat = '全部'; renderList(); setView('list'); };
  $('prevM').onclick = () => { if (state.cycle) { state.anchor = state.cycle.prevStart; load(); } };
  $('nextM').onclick = () => { if (state.cycle && state.cycle.nextStart <= state.today) { state.anchor = state.cycle.nextStart; load(); } };
  $('budgetEditBtn').onclick = () => { if (state.version) openBudgetEditor(); };
  $('incomeBtn').onclick = () => { if (state.cycle) openIncome(''); };
  $('refreshBtn').onclick = () => { load(); if (state.view === 'assets') loadAssets(); };
  $('snapBtn').onclick = () => openSnapshot('');
  $('assetRemind').onclick = () => openSnapshot('');
  $('settingsBtn').onclick = openSettings;
  $('sheetBg').onclick = closeSheet;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

  // ---------- 啟動 ----------
  state.today = twToday();
  state.anchor = state.today;
  if (isDemo()) setTimeout(() => toast('目前是示範資料，按右上角設定連線'), 600);
  load();
})();
</script>
</body>
</html>
