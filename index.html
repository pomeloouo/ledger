<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<title>記帳</title>
<style>
:root {
  --bg: #f6f6f4;
  --surface: #ffffff;
  --surface-2: #eeeeeb;
  --line: #e1e1dc;
  --text: #1c1c1e;
  --text-2: #5f5f66;
  --text-3: #8a8a91;
  --accent: #0f8a6a;
  --accent-soft: rgba(15, 138, 106, .12);
  --on-accent: #ffffff;
  --warn: #b25e09;
  --warn-soft: rgba(178, 94, 9, .12);
  --danger: #c03a2b;
  --radius: 14px;
  --nav-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141416;
    --surface: #1d1d20;
    --surface-2: #26262a;
    --line: #2f2f34;
    --text: #ececef;
    --text-2: #a5a5ad;
    --text-3: #75757d;
    --accent: #3cc79b;
    --accent-soft: rgba(60, 199, 155, .14);
    --on-accent: #0b1f18;
    --warn: #f0a24b;
    --warn-soft: rgba(240, 162, 75, .14);
    --danger: #f06b5c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141416; --surface: #1d1d20; --surface-2: #26262a; --line: #2f2f34;
  --text: #ececef; --text-2: #a5a5ad; --text-3: #75757d;
  --accent: #3cc79b; --accent-soft: rgba(60, 199, 155, .14); --on-accent: #0b1f18;
  --warn: #f0a24b; --warn-soft: rgba(240, 162, 75, .14); --danger: #f06b5c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom));
}
.num { font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

/* 頂部 */
header.top {
  position: sticky; top: 0; z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
header.top .wrap { display: flex; align-items: center; gap: 8px; height: 56px; }
.month { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; }
.month strong { font-size: 17px; min-width: 88px; padding: 0 8px; text-align: center; white-space: nowrap; }
.icon-btn {
  width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent;
  display: grid; place-items: center; color: var(--text-2);
}
.icon-btn:active { background: var(--surface-2); }
.icon-btn svg { width: 20px; height: 20px; }
.demo-tag {
  font-size: 12px; color: var(--warn); background: var(--warn-soft);
  padding: 2px 8px; border-radius: 999px; white-space: nowrap;
}

main section[hidden] { display: none; }
.block { margin-top: 20px; }
.block h2 { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 0 0 10px; }

/* 總覽 */
.hero { padding-top: 24px; }
.hero .label, .asset-hero .label { color: var(--text-2); font-size: 14px; }
.hero .total, .asset-hero .total { font-size: 40px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; margin: 2px 0 6px; }
.hero .cmp, .asset-hero .cmp { font-size: 14px; color: var(--text-2); }
.hero .cmp b, .asset-hero .cmp b { font-weight: 600; }
.up { color: var(--danger); }
.down { color: var(--accent); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.stat span { display: block; font-size: 13px; color: var(--text-2); }
.stat b { font-size: 20px; font-weight: 650; }

.pending-banner {
  display: flex; align-items: center; gap: 10px; width: 100%;
  margin-top: 16px; padding: 12px 14px; border-radius: var(--radius);
  background: var(--warn-soft); color: var(--text); border: 0; text-align: left;
}
.pending-banner svg { width: 20px; height: 20px; color: var(--warn); flex: none; }
.pending-banner span { flex: 1; }
.pending-banner b { color: var(--warn); }

/* 預算類別展開後的分類明細 */
.cat-list { grid-column: 1 / -1; display: grid; gap: 8px; margin-top: 6px; padding-top: 10px; border-top: 1px dashed var(--line); }
.cat-row { display: grid; grid-template-columns: 72px 1fr auto; align-items: center; gap: 10px; font-size: 13px; color: var(--text-2); }
.cat-row .bar { height: 8px; border-radius: 4px; background: var(--text-3); opacity: .55; min-width: 3px; }
.cat-row .v { text-align: right; min-width: 72px; }

.daily { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 12px 8px; }
.daily svg { display: block; width: 100%; height: 140px; }
.daily .axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); padding: 4px 2px 0; }

/* 明細列表 */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.day-head {
  display: flex; justify-content: space-between; padding: 10px 14px 6px;
  font-size: 13px; color: var(--text-2); background: var(--surface-2);
}
.rec {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center;
  width: 100%; padding: 12px 14px; min-height: 56px; border: 0; background: transparent; text-align: left;
  border-top: 1px solid var(--line);
}
.day-head + .rec { border-top: 0; }
.rec:active { background: var(--surface-2); }
.rec .item { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rec .amt { font-weight: 600; text-align: right; }
.rec .meta { font-size: 13px; color: var(--text-3); }
.rec .badge { font-size: 12px; text-align: right; }
.rec.need .amt, .rec.need .badge, .rec.check .badge { color: var(--warn); }

.filters { display: flex; gap: 8px; overflow-x: auto; padding: 16px 0 4px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.chip {
  flex: none; height: 36px; padding: 0 14px; border-radius: 999px; font-size: 14px;
  border: 1px solid var(--line); background: var(--surface); color: var(--text-2);
}
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

.empty { text-align: center; color: var(--text-2); padding: 40px 16px; font-size: 14px; }
.empty b { display: block; color: var(--text); font-size: 16px; margin-bottom: 4px; }

/* 記一筆 */
.composer { margin-top: 20px; }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 13px; font-weight: 600; color: var(--text-2); }
.field .help { font-size: 13px; color: var(--text-3); }
input, select, textarea {
  width: 100%; min-height: 48px; padding: 10px 12px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface);
  font-size: 16px; /* 避免 iOS 放大 */
}
textarea { min-height: 96px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
.btn {
  height: 48px; padding: 0 20px; border-radius: 12px; border: 0;
  background: var(--accent); color: var(--on-accent); font-weight: 600; width: 100%;
  transition: transform .12s ease;
}
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .55; }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
.examples { display: flex; flex-wrap: wrap; gap: 8px; margin: -4px 0 16px; }
.examples .chip { height: 32px; font-size: 13px; }

.result { margin-top: 16px; display: grid; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.card .title { display: flex; justify-content: space-between; font-weight: 600; }
.card .sub { font-size: 13px; color: var(--text-2); margin-top: 2px; }
.card.warn { border-color: var(--warn); }
.card .note { font-size: 13px; color: var(--warn); margin-top: 6px; }
.card .undo { margin-top: 10px; height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--text-2); font-size: 13px; }
.card.undone { opacity: .5; }
.last-line { font-size: 13px; color: var(--text-2); background: var(--surface-2); border-radius: 10px; padding: 8px 12px; }
.pick { display: flex; flex-wrap: wrap; gap: 6px; }
.pick .chip { height: 36px; font-size: 14px; }
.msg { font-size: 14px; color: var(--text-2); }
.msg.err { color: var(--danger); }

/* 底部導覽 */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs .wrap { display: grid; grid-template-columns: repeat(4, 1fr); height: var(--nav-h); padding: 0; }
nav.tabs button {
  border: 0; background: transparent; color: var(--text-3);
  display: grid; place-items: center; align-content: center; gap: 2px; font-size: 12px;
}
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: var(--accent); font-weight: 600; }

/* 底部面板 */
.sheet-bg {
  position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .45);
  opacity: 0; pointer-events: none; transition: opacity .2s ease;
}
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 31;
  max-width: 560px; margin: 0 auto; max-height: 92dvh; overflow-y: auto;
  background: var(--bg); border-radius: 20px 20px 0 0;
  padding: 8px 16px calc(20px + env(safe-area-inset-bottom));
  transform: translateY(100%); transition: transform .28s cubic-bezier(.16, 1, .3, 1);
}
.sheet.open { transform: none; }
.sheet-bg.open { opacity: 1; pointer-events: auto; }
.sheet .grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 12px; }
.sheet h3 { margin: 0 0 4px; font-size: 18px; }
.sheet .raw { font-size: 13px; color: var(--text-2); background: var(--surface-2); padding: 10px 12px; border-radius: 10px; margin: 8px 0 16px; }
.sheet .raw b { color: var(--text); font-weight: 500; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 6px; }

/* 載入骨架 */
.skel { background: var(--surface-2); border-radius: 8px; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .5; } }
@media (prefers-reduced-motion: reduce) {
  .skel { animation: none; }
  .sheet, .sheet-bg, .btn { transition: none; }
}

/* 預算 */
.stats.four { grid-template-columns: 1fr 1fr; }
.stat-btn { text-align: left; font: inherit; color: inherit; width: 100%; }
.stat-btn:active { background: var(--surface-2); }
.stat-btn span { color: var(--accent) !important; }
.stat small { display: block; font-size: 12px; color: var(--text-3); margin-top: 2px; }
.block-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.block-head h2 { margin: 0; }
.link-btn { border: 0; background: transparent; color: var(--accent); font-size: 14px; font-weight: 600; min-height: 44px; padding: 0 4px; }
.budget { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.bud {
  display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; width: 100%;
  padding: 14px; border: 0; background: transparent; text-align: left; border-top: 1px solid var(--line);
}
.bud:first-child { border-top: 0; }
button.bud:active { background: var(--surface-2); }
.bud .name { font-weight: 600; }
.bud .name small { font-weight: 400; color: var(--text-3); margin-left: 6px; font-size: 12px; }
.bud .fig { text-align: right; font-weight: 600; }
.bud .fig small { color: var(--text-3); font-weight: 400; }
.bud .track { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bud .fill { height: 100%; border-radius: 4px; background: var(--accent); }
.bud.warn .fill { background: var(--warn); }
.bud.over .fill { background: var(--danger); }
.bud .sub { grid-column: 1 / -1; font-size: 13px; color: var(--text-2); }
.bud.over .sub b { color: var(--danger); }
.bud.warn .sub b { color: var(--warn); }
.note-line { font-size: 13px; color: var(--text-3); margin: 8px 2px 0; }
.note-line.warn { color: var(--warn); }
.sched { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.sched div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.sched span { display: block; font-size: 12px; color: var(--text-2); }
.sched b { display: block; font-size: 18px; font-weight: 650; margin-top: 2px; white-space: nowrap; }
.sched small { white-space: normal; }
.sched small { font-size: 12px; color: var(--text-3); }
.sched .hot { border-color: var(--warn); background: var(--warn-soft); }
.sched .hot small { color: var(--warn); font-weight: 600; }

/* 預算設定面板 */
.bedit { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; background: var(--surface); }
.bedit .top { display: grid; grid-template-columns: 1fr 88px 84px 40px; gap: 8px; align-items: end; }
.bedit .top .field { margin: 0; }
.bedit .cats-pick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.bedit .cats-pick .chip { height: 32px; font-size: 13px; padding: 0 12px; }
.bedit .cats-pick .chip.taken { opacity: .35; }
.bedit .rm { width: 40px; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--danger); font-size: 20px; }
.sumline { display: flex; justify-content: space-between; align-items: center; padding: 10px 2px; font-size: 14px; }
.sumline b.bad { color: var(--danger); }
.sumline b.ok { color: var(--accent); }
.tlist { margin: 4px 0 16px; }
.tlist .trow { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.tlist .trow button { border: 0; background: transparent; color: var(--danger); min-height: 36px; }

/* 資產 */
.asset-hero { padding-top: 24px; }
.asset-hero .when { font-size: 14px; color: var(--text-2); }
.acct { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
.acct:first-child { border-top: 0; }
.acct .nm { font-weight: 550; }
.acct .tp { font-size: 13px; color: var(--text-3); }
.acct .am { font-weight: 600; text-align: right; }
.acct .df { font-size: 13px; text-align: right; color: var(--text-3); }
.acct.debt .am { color: var(--danger); }
.acct.total { background: var(--surface-2); }
.trend { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 12px 8px; }
.trend svg { display: block; width: 100%; height: 140px; overflow: visible; }
.trend .axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); padding: 6px 2px 0; }
.snap-row { display: flex; justify-content: space-between; width: 100%; padding: 12px 14px; min-height: 48px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; font-size: 14px; }
.snap-row:first-child { border-top: 0; }
.snap-row:active { background: var(--surface-2); }
.sedit { display: grid; grid-template-columns: 1fr 84px 1fr 40px; gap: 8px; align-items: end; margin-bottom: 10px; }
.sedit .field { margin: 0; }
.sedit .rm { width: 40px; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--danger); font-size: 20px; }
.since { font-size: 13px; color: var(--text-2); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; margin-top: 12px; line-height: 1.7; }

.toast {
  position: fixed; left: 50%; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom)); z-index: 40;
  transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px);
  opacity: 0; transition: opacity .2s; pointer-events: none;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="month">
      <button class="icon-btn" id="prevM" aria-label="上一期">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <strong id="monthLabel" class="num">----</strong>
      <button class="icon-btn" id="nextM" aria-label="下一期">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
    <span class="demo-tag" id="demoTag" hidden>示範資料</span>
    <button class="icon-btn" id="refreshBtn" aria-label="重新整理">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button class="icon-btn" id="settingsBtn" aria-label="設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <!-- 總覽 -->
  <section id="view-overview">
    <div class="hero">
      <div class="label" id="totalLabel">本月支出</div>
      <div class="total num" id="total"><span class="skel" style="display:inline-block;width:180px;height:40px"></span></div>
      <div class="cmp num" id="cmp">&nbsp;</div>
      <div class="stats four">
        <div class="stat"><span>今天還能花</span><b class="num" id="todayLeft">-</b><small id="todayLeftNote">&nbsp;</small></div>
        <div class="stat"><span>今日已花</span><b class="num" id="todayAmt">-</b><small>&nbsp;</small></div>
        <button class="stat stat-btn" id="incomeBtn"><span>本月收入 ›</span><b class="num" id="incomeAmt">-</b><small id="incomeNote">&nbsp;</small></button>
        <div class="stat"><span>本月剩餘</span><b class="num" id="balanceAmt">-</b><small id="balanceNote">&nbsp;</small></div>
      </div>
      <button class="pending-banner" id="pendingBanner" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        <span id="pendingText"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
    <div class="block">
      <h2>近期日程</h2>
      <div class="sched" id="sched"></div>
    </div>
    <div class="block">
      <div class="block-head"><h2>預算</h2><button class="link-btn" id="budgetEditBtn">調整</button></div>
      <div class="budget" id="budget"></div>
      <p class="note-line" id="budgetNote"></p>
    </div>
    <div class="block">
      <h2>每日支出</h2>
      <div class="daily"><svg id="dailySvg" preserveAspectRatio="none" role="img" aria-label="本月每日支出長條圖"></svg><div class="axis num" id="dailyAxis"></div></div>
    </div>
    <div class="block">
      <h2>最近紀錄</h2>
      <div id="recent"></div>
    </div>
  </section>

  <!-- 明細 -->
  <section id="view-list" hidden>
    <div class="filters" id="statusFilters"></div>
